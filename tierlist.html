 * Importing throws away whatever is on screen, so unsaved work gets a
 * confirmation first — in the banner, matching how deletes are confirmed
 * elsewhere, rather than a native dialog.
 */
function requestImport(file) {
  if (!runtime.dirty) return importList(file);

  showBanner({
    tone: "warn",
    text: "Replace the current list with “" + file.name + "”? Unsaved changes will be lost.",
    actions: [
      { label: "Replace", onClick: () => { dismissBanner(); return importList(file); } },
      { label: "Cancel", onClick: dismissBanner },
    ],
  });
}

function showBanner(banner) {
  runtime.banner = banner;
  renderBanner();
}

function dismissBanner() {
  runtime.banner = null;
  renderBanner();
}

/* ==========================================================================
   8. EVENTS
   ========================================================================== */

/**
 * Wide viewports give the panel its own column and the board stays reachable,
 * so focus is free to leave. Narrow ones have it float over the board, where
 * tabbing to something underneath it would be tabbing into nowhere.
 */
function isFileDrag(event) {
  const transfer = event.dataTransfer;
  return !!transfer && Array.prototype.includes.call(transfer.types || [], "Files");
}

function isPanelOverlaying() {
  return typeof window.matchMedia === "function" &&
         window.matchMedia("(max-width: 1100px)").matches;
}

function trapTab(event) {
  const focusable = dom.panel.querySelectorAll("input, textarea, button, [tabindex]");
  if (focusable.length === 0) return;

  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  const active = document.activeElement;

  if (event.shiftKey && (active === first || !dom.panel.contains(active))) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && active === last) {
    event.preventDefault();
    first.focus();
  }
}

function bindEvents() {
  dom.panelClose.addEventListener("click", closePanel);

  // Pasting an image anywhere in the panel attaches it, but only while the
  // item is actually in image mode — otherwise a paste into a textarea would
  // be hijacked.
  dom.panel.addEventListener("paste", event => {
    const item = runtime.panelOpen ? getItem(runtime.selectedItemId) : null;
    if (!item || item.shortType !== "image") return;

    const file = event.clipboardData && event.clipboardData.files[0];
    if (!file) return;
    event.preventDefault();
    attachImage(item.id, file);
  });

  dom.boardScroll.addEventListener("pointerdown", onBoardPointerDown);

  // Clicking bare board space dismisses the panel; clicking a card or a tier
  // control does not.
  dom.boardScroll.addEventListener("click", event => {
    if (!runtime.panelOpen) return;
    if (event.target.closest(".item, .tier-label, .tier-tools")) return;
    closePanel();
  });

  dom.title.classList.add("editable");
  dom.title.title = "Click to rename";
  dom.title.addEventListener("click", () => {
    startRename(dom.title, state.title, setTitle);
  });

  // Disarm a pending delete when attention moves elsewhere. This listens for
  // click rather than pointerdown so the clicked control's own handler runs
  // first — re-rendering on pointerdown would detach it mid-gesture.
  document.addEventListener("click", event => {
    if (!runtime.pendingDelete) return;
    if (event.target.closest(".confirming, .confirm-row, .icon-btn.danger")) return;
    clearPendingDelete();
  });

  // Dropping an archive anywhere opens it. The panel's image drop zone stops
  // its own drops from reaching here.
  window.addEventListener("dragover", event => {
    if (isFileDrag(event)) event.preventDefault();
  });
  window.addEventListener("drop", event => {
    if (!isFileDrag(event)) return;
    event.preventDefault();
    const file = event.dataTransfer.files[0];
    if (file) requestImport(file);
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Tab" && runtime.panelOpen && isPanelOverlaying()) {
      trapTab(event);
      return;
    }
    if (event.key !== "Escape") return;
    if (runtime.drag) {
      releaseDragListeners();
      endDrag(false);
      return;
    }
    if (clearPendingDelete()) return;
    if (runtime.panelOpen) closePanel();
  });
}

/* ==========================================================================
   9. BOOT
   ========================================================================== */

function boot() {
  cacheDom();
  bindEvents();
  // Phase 7 restores a persisted session here before the first render.
  render();
}

boot();
</script>
</body>
</html>
