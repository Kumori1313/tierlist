  dim: "#a2a9b8",
};

function fitText(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let cut = text;
  while (cut.length > 1 && ctx.measureText(cut + "…").width > maxWidth) {
    cut = cut.slice(0, -1);
  }
  return cut + "…";
}

function boxPath(ctx, x, y, w, h, r) {
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  } else {
    ctx.beginPath();
    ctx.rect(x, y, w, h);
  }
}

/** Draws src into a w×h box, cropping the overflow rather than squashing. */
function drawCover(ctx, source, x, y, w, h) {
  const scale = Math.max(w / source.width, h / source.height);
  const sw = w / scale;
  const sh = h / scale;
  ctx.drawImage(source,
    (source.width - sw) / 2, (source.height - sh) / 2, sw, sh,
    x, y, w, h);
}

async function renderSnapshot() {
  const columns = clamp(
    state.tiers.reduce((most, tier) => Math.max(most, tier.items.length), 1),
    4, SNAP.maxColumns);

  const rowsFor = tier => Math.max(1, Math.ceil(tier.items.length / columns));
  const heightFor = tier =>
    SNAP.pad * 2 + rowsFor(tier) * SNAP.card + (rowsFor(tier) - 1) * SNAP.gap;

  const width = SNAP.label + SNAP.pad * 2 + columns * SNAP.card + (columns - 1) * SNAP.gap;
  const height = SNAP.titleBand +
    state.tiers.reduce((sum, tier) => sum + heightFor(tier) + 2, 0) + SNAP.pad;

  const canvas = document.createElement("canvas");
  canvas.width = width * SNAP.scale;
  canvas.height = height * SNAP.scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(SNAP.scale, SNAP.scale);
  ctx.textBaseline = "middle";

  ctx.fillStyle = SNAP.bg;
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = SNAP.text;
  ctx.font = "600 22px ui-sans-serif, system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(fitText(ctx, state.title, width - SNAP.pad * 2), SNAP.pad, SNAP.titleBand / 2 + 2);

  // Decode every image once up front; drawing is synchronous after this.
  const bitmaps = new Map();
  for (const item of Object.values(state.items)) {
    if (item.shortType !== "image" || !item.image || bitmaps.has(item.image)) continue;
    const held = runtime.images.get(item.image);
    if (!held) continue;
    try {
      bitmaps.set(item.image, await createImageBitmap(held.blob));
    } catch (error) {
      // A picture that will not decode simply falls back to its name.
    }
  }

  let y = SNAP.titleBand;
  for (const tier of state.tiers) {
    const rowHeight = heightFor(tier);

    ctx.fillStyle = tier.color;
    ctx.fillRect(0, y, SNAP.label, rowHeight);
    ctx.fillStyle = SNAP.row;
    ctx.fillRect(SNAP.label, y, width - SNAP.label, rowHeight);

    ctx.fillStyle = SNAP.ink;
    ctx.font = "700 20px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(fitText(ctx, tier.name || "", SNAP.label - 12), SNAP.label / 2, y + rowHeight / 2);

    tier.items.forEach((id, index) => {
      const item = getItem(id);
      if (!item) return;

      const column = index % columns;
      const row = Math.floor(index / columns);
      const x = SNAP.label + SNAP.pad + column * (SNAP.card + SNAP.gap);
      const top = y + SNAP.pad + row * (SNAP.card + SNAP.gap);

      ctx.save();
      boxPath(ctx, x, top, SNAP.card, SNAP.card, 8);
      ctx.clip();

      const bitmap = item.shortType === "image" && bitmaps.get(item.image);
      if (bitmap) {
        drawCover(ctx, bitmap, x, top, SNAP.card, SNAP.card);
        const scrim = ctx.createLinearGradient(0, top + SNAP.card - 34, 0, top + SNAP.card);
        scrim.addColorStop(0, "rgba(0,0,0,0)");
        scrim.addColorStop(1, "rgba(0,0,0,0.82)");
        ctx.fillStyle = scrim;
        ctx.fillRect(x, top + SNAP.card - 34, SNAP.card, 34);
        ctx.fillStyle = "#ffffff";
      } else {
        ctx.fillStyle = SNAP.cardBg;
        ctx.fillRect(x, top, SNAP.card, SNAP.card);

        const short = (item.shortText || "").trim();
        if (short) {
          ctx.fillStyle = SNAP.dim;
          ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(fitText(ctx, short, SNAP.card - 12), x + SNAP.card / 2, top + SNAP.card / 2 - 8);
        }
        ctx.fillStyle = SNAP.text;
      }

      ctx.font = "600 12px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(fitText(ctx, item.name, SNAP.card - 10),
                   x + SNAP.card / 2, top + SNAP.card - 13);
      ctx.restore();

      ctx.strokeStyle = SNAP.cardEdge;
      ctx.lineWidth = 1;
      boxPath(ctx, x + .5, top + .5, SNAP.card - 1, SNAP.card - 1, 8);
      ctx.stroke();
    });

    y += rowHeight + 2;
  }

  for (const bitmap of bitmaps.values()) {
    if (bitmap.close) bitmap.close();
  }
  return canvasToBlob(canvas, "image/png");
}

async function exportSnapshot() {
  try {
    downloadBlob(await renderSnapshot(), slugify(state.title) + ".png");
  } catch (error) {
    showBanner({ tone: "warn", text: "Could not render an image: " + error.message });
  }
}

/* --- import --------------------------------------------------------------- */

const asString = (value, fallback) => typeof value === "string" ? value : fallback;

/**
 * Turns a stored manifest into a document this app can render, whatever it
 * came from — an archive or the autosaved session.
 *
 * Repairs rather than rejects wherever the intent is recoverable: duplicate
 * placements, items that belong to no list, references to items that no longer
 * exist, images whose bytes are gone. Only an unreadable manifest is fatal.
 *
 * @param {object} manifest
 * @param {(path: string) => Promise<Uint8Array|null>} getBytes
 * @returns {{doc: object, images: Map, notes: string[]}}
 */
async function adoptManifest(manifest, getBytes) {
  const notes = [];

  if (typeof manifest !== "object" || manifest === null) {
    throw new Error("The manifest in that archive is not valid JSON.");
  }
  if (typeof manifest.schema === "number" && manifest.schema > SCHEMA_VERSION) {
    throw new Error("That list was saved by a newer version of this app.");
  }
  // Older schemas would be migrated here; version 1 is the only one so far.

  const rawItems = (manifest.items && typeof manifest.items === "object") ? manifest.items : {};
  const rawImages = (manifest.images && typeof manifest.images === "object") ? manifest.images : {};

  /* items ------------------------------------------------------------------ */

  const items = {};
  for (const [id, raw] of Object.entries(rawItems)) {
    if (!raw || typeof raw !== "object") continue;
    const shortType = raw.shortType === "image" ? "image" : "text";
    items[id] = {
      id,
      name: asString(raw.name, DEFAULT_ITEM_NAME),
      shortType,
      shortText: asString(raw.shortText, ""),
      image: asString(raw.image, null),
      description: asString(raw.description, ""),
      accent: asString(raw.accent, null),
    };
  }

  /* images ----------------------------------------------------------------- */

  const images = new Map();
  const keptImages = {};
  let missing = 0;

  for (const item of Object.values(items)) {
    if (!item.image) continue;
    if (images.has(item.image)) continue;

    const bytes = await getBytes(item.image);
    if (!bytes) {
      // The manifest points at bytes that are not there. Keep the item, drop
      // the picture, say so.
      for (const sibling of Object.values(items)) {
        if (sibling.image !== item.image) continue;
        if (sibling.shortType === "image") sibling.shortType = "text";
        sibling.image = null;
      }
      missing++;
      continue;
    }

    {
      const meta = rawImages[item.image] || {};
      const mime = asString(meta.mime, "application/octet-stream");
      const blob = new Blob([bytes], { type: mime });

      images.set(item.image, {
        blob,
        url: URL.createObjectURL(blob),
        filename: asString(meta.filename, item.image),
        mime,
        width: Number(meta.width) || 0,
        height: Number(meta.height) || 0,
      });
      keptImages[item.image] = {
        filename: asString(meta.filename, item.image),
        mime,
        bytes: bytes.length,
        width: Number(meta.width) || 0,
        height: Number(meta.height) || 0,
      };
    }
  }

  if (missing > 0) {
    notes.push(missing === 1
      ? "1 image was missing from the archive; that item fell back to text."
      : missing + " images were missing from the archive; those items fell back to text.");
  }

  const orphanImages = Object.keys(rawImages).length - Object.keys(keptImages).length;
  if (orphanImages > 0) {
    notes.push(orphanImages === 1
      ? "1 unused image was dropped."
      : orphanImages + " unused images were dropped.");
  }

  /* placements ------------------------------------------------------------- */

  const placed = new Set();
  let duplicates = 0;
  let unknown = 0;

  const cleanList = list => {
    const out = [];
    for (const id of Array.isArray(list) ? list : []) {
      if (!items[id]) { unknown++; continue; }
      if (placed.has(id)) { duplicates++; continue; }
      placed.add(id);
      out.push(id);
    }
    return out;
  };

  const rawTiers = Array.isArray(manifest.tiers) ? manifest.tiers : [];
  const tiers = rawTiers
    .filter(tier => tier && typeof tier === "object")
    .map(tier => ({
      id: asString(tier.id, null) || newId("tier"),
      name: asString(tier.name, DEFAULT_TIER_NAME),
      color: asString(tier.color, "#c9c9c9"),
      items: cleanList(tier.items),
    }));

  const pool = cleanList(manifest.pool);

  // Anything the archive forgot to place still exists — park it in the pool
  // rather than losing it.
  const stranded = Object.keys(items).filter(id => !placed.has(id));
  pool.push(...stranded);

  if (duplicates > 0) {
    notes.push(duplicates + (duplicates === 1 ? " duplicate placement was" : " duplicate placements were") + " removed.");
  }
  if (unknown > 0) {
    notes.push(unknown + (unknown === 1 ? " reference to a missing item was" : " references to missing items were") + " dropped.");
  }
  if (stranded.length > 0) {
    notes.push(stranded.length + (stranded.length === 1 ? " unplaced item was" : " unplaced items were") + " moved to Unassigned.");
  }
  if (tiers.length === 0) {
    notes.push("That list had no tiers, so the defaults were used.");
  }

  const now = new Date().toISOString();
  const doc = {
    schema: SCHEMA_VERSION,
    app: "tierlist",
    title: asString(manifest.title, "Untitled Tier List"),
    createdAt: asString(manifest.createdAt, now),
    modifiedAt: asString(manifest.modifiedAt, now),
    tiers: tiers.length > 0 ? tiers : createEmptyDocument().tiers,
    pool,
    items,
    images: keptImages,
  };

  return { doc, images, notes };
}

async function readArchive(file) {
  const buffer = await file.arrayBuffer();
  const files = readZip(new Uint8Array(buffer));

  const entry = files.get(MANIFEST_NAME);
  if (!entry) {
    throw new Error("That archive has no " + MANIFEST_NAME + " — it is not a tier list.");
  }

  const text = new TextDecoder().decode(await unpack(entry));
  let manifest;
  try {
    manifest = JSON.parse(text);
  } catch (error) {
    throw new Error("The manifest in that archive is not valid JSON.");
  }

  return adoptManifest(manifest, async path => {
    const file = files.get(path);
    return file ? unpack(file) : null;
  });
}

/** Replaces the whole document. Frees everything the old one was holding. */
function installDocument(doc, images) {
  for (const held of runtime.images.values()) URL.revokeObjectURL(held.url);
  runtime.images.clear();
  for (const [path, held] of images) runtime.images.set(path, held);

  state = doc;
  clearHistory();     // there is no undoing across a document replacement
  runtime.selectedItemId = null;
  runtime.panelOpen = false;
  runtime.panelError = null;
  runtime.pendingDelete = null;
  runtime.dirty = false;
  render();
}

async function importList(file) {
  try {
    const { doc, images, notes } = await readArchive(file);
    installDocument(doc, images);
    showBanner(notes.length > 0
      ? { tone: "warn", text: "Loaded with repairs — " + notes.join(" ") }
      : { tone: "info", text: "Loaded “" + doc.title + "”." });
  } catch (error) {
    showBanner({ tone: "warn", text: "Could not open that file: " + error.message });
  }
}

/**
 * Importing throws away whatever is on screen, so unsaved work gets a
 * confirmation first — in the banner, matching how deletes are confirmed
 * elsewhere, rather than a native dialog.
 */
function requestImport(file) {
  if (!runtime.dirty) return importList(file);

  showBanner({
    tone: "warn",
    text: "Replace the current list with “" + file.name + "”? Unsaved changes will be lost.",
    actions: [
      { label: "Replace", onClick: () => { dismissBanner(); return importList(file); } },
      { label: "Cancel", onClick: dismissBanner },
    ],
  });
}

let bannerTimer = 0;

function showBanner(banner) {
  runtime.banner = banner;
  renderBanner();

  // Confirmations and warnings stay until acted on; a plain acknowledgement
  // should not need dismissing.
  clearTimeout(bannerTimer);
  if (banner && banner.tone !== "warn" && !banner.actions) {
    bannerTimer = setTimeout(() => {
      if (runtime.banner === banner) dismissBanner();
    }, 6000);
  }
}

function dismissBanner() {
  runtime.banner = null;
  renderBanner();
}

/* ==========================================================================
   8. STORAGE

   The session autosaves to IndexedDB — not localStorage, which cannot hold
   blobs and would be exhausted by a handful of images anyway. The document
   goes in one store, image bytes in another, keyed by the same archive paths
   the manifest uses, so restoring reuses the importer's validation wholesale.

   None of this is guaranteed to work. Opened over file://, some browsers
   treat every page as its own opaque origin and refuse persistent storage
   outright. That is detected once at boot, and the app degrades to
   export-only with a visible warning rather than pretending to save.
   ========================================================================== */

const DB_NAME = "tierlist";
const DB_VERSION = 1;
const STORE_DOC = "document";
const STORE_IMAGES = "images";
const DOC_KEY = "current";
const SAVE_DEBOUNCE_MS = 600;
const DB_OPEN_TIMEOUT_MS = 4000;

function promisify(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Request failed"));
  });
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined" || indexedDB === null) {
      reject(new Error("This browser has no IndexedDB."));
      return;
    }

    let request;
    try {
      request = indexedDB.open(DB_NAME, DB_VERSION);
    } catch (error) {
      // Opening can throw outright on an opaque origin.
      reject(error);
      return;
    }

    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(STORE_DOC)) db.createObjectStore(STORE_DOC);
      if (!db.objectStoreNames.contains(STORE_IMAGES)) db.createObjectStore(STORE_IMAGES);
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("IndexedDB is unavailable."));
    request.onblocked = () => reject(new Error("Another tab is holding the database open."));
  });
}

/** Some file:// contexts neither resolve nor reject; don't hang the boot. */
function withTimeout(promise, ms, message) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms)),
  ]);
}

async function initStorage() {
  if (runtime.storage.available !== null) return runtime.storage.available;

  try {
    runtime.storage.db = await withTimeout(
      openDatabase(), DB_OPEN_TIMEOUT_MS, "Storage did not respond.");
    runtime.storage.available = true;
  } catch (error) {
    runtime.storage.db = null;
    runtime.storage.available = false;
    runtime.storage.error = error.message;
  }
  return runtime.storage.available;
}

/** One read-write transaction, resolving when it commits rather than per request. */
function writeTransaction(db, work) {
  return new Promise((resolve, reject) => {
    let tx;
    try {
      tx = db.transaction([STORE_DOC, STORE_IMAGES], "readwrite");
    } catch (error) {
      reject(error);
      return;
    }
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error("Could not write to storage."));
    tx.onabort = () => reject(tx.error || new Error("Storage write was aborted."));
    work(tx.objectStore(STORE_DOC), tx.objectStore(STORE_IMAGES));
  });
}

async function saveSession() {
  const db = runtime.storage.db;
  if (!db) return;

  const doc = serializeDocument();
  const wanted = Object.keys(doc.images);

  // Which blobs are already down there? Read in its own transaction: awaiting
  // inside a live one lets it commit out from under the writes.
  const stored = await promisify(
    db.transaction(STORE_IMAGES, "readonly").objectStore(STORE_IMAGES).getAllKeys());

  const toWrite = wanted
    .filter(path => !stored.includes(path) && runtime.images.has(path))
    .map(path => [path, runtime.images.get(path).blob]);
  const toDrop = stored.filter(path => !wanted.includes(path));

  await writeTransaction(db, (docs, images) => {
    docs.put(doc, DOC_KEY);
    for (const [path, blob] of toWrite) images.put(blob, path);
    for (const path of toDrop) images.delete(path);
  });
}

let saveTimer = 0;

function scheduleSave() {
  if (runtime.storage.available === false) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, SAVE_DEBOUNCE_MS);
}

async function saveNow() {
  clearTimeout(saveTimer);
  if (!(await initStorage())) return;

  try {
    await saveSession();
    runtime.storage.error = null;
  } catch (error) {
    // Most likely the quota. Say so once and stop trying on every keystroke.
    runtime.storage.available = false;
    runtime.storage.error = error.message;
    showBanner({
      tone: "warn",
      text: "Changes are no longer being saved automatically (" + error.message +
            ") — use Save to keep this list.",
    });
  }
}

async function loadSession() {
  const db = runtime.storage.db;
  if (!db) return null;

  const manifest = await promisify(
    db.transaction(STORE_DOC, "readonly").objectStore(STORE_DOC).get(DOC_KEY));
  if (!manifest) return null;

  return adoptManifest(manifest, async path => {
    const blob = await promisify(
      db.transaction(STORE_IMAGES, "readonly").objectStore(STORE_IMAGES).get(path));
    if (!blob) return null;
    return new Uint8Array(await blob.arrayBuffer());
  });
}

async function restoreSession() {
  if (!(await initStorage())) {
    showBanner({
      tone: "warn",
      text: "This browser will not let the page store anything (" +
            runtime.storage.error + "). Your work is kept only until you close " +
            "the tab — use Save to keep it.",
    });
    return;
  }

  try {
    const restored = await loadSession();
    if (!restored) return;
    installDocument(restored.doc, restored.images);
    if (restored.notes.length > 0) {
      showBanner({
        tone: "warn",
        text: "Restored with repairs — " + restored.notes.join(" "),
      });
    }
  } catch (error) {
    showBanner({ tone: "warn", text: "Could not restore the last session: " + error.message });
  }
}

async function clearStoredSession() {
  const db = runtime.storage.db;
  if (!db) return;
  try {
    await writeTransaction(db, (docs, images) => {
      docs.delete(DOC_KEY);
      images.clear();
    });
  } catch (error) {
    // Nothing useful to do; the next save overwrites it anyway.
  }
}

/** Throws the current list away and starts over. */
function newList() {
  const start = async () => {
    dismissBanner();
    installDocument(createEmptyDocument(), new Map());
    await clearStoredSession();
    saveNow();
  };

  if (!runtime.dirty) return start();

  showBanner({
    tone: "warn",
    text: "Start a new list? Unsaved changes will be lost.",
    actions: [
      { label: "New list", onClick: start },
      { label: "Cancel", onClick: dismissBanner },
    ],
  });
}

/* ==========================================================================
   9. KEYBOARD

   Every drag has a keyboard equivalent, following the pick-up / move / drop
   pattern rather than making bare arrow keys move things: unheld arrows stay
   free to walk between cards, which is what a keyboard user expects a list to
   do. Space picks up, arrows move, Space drops, Escape puts it back.

   Movements go through commit() like any other, so they are undoable and
   autosaved, and each one is announced to screen readers.
   ========================================================================== */

const clamp = (value, low, high) => Math.min(high, Math.max(low, value));

function announce(message) {
  if (!dom.live) return;
  // Re-setting identical text does not re-announce; clear first.
  dom.live.textContent = "";
  dom.live.textContent = message;
}

/** Where a grabbed thing started, so Escape can put it back. */
function captureOrigin(kind, id) {
  if (kind === "tier") {
    return { index: state.tiers.findIndex(tier => tier.id === id) };
  }
  const loc = locateItem(id);
  if (!loc) return null;
  return { zone: loc.tier ? loc.tier.id : "pool", index: loc.index };
}

function itemLists() {
  return [
    ...state.tiers.map(tier => ({ list: tier.items, name: tier.name })),
    { list: state.pool, name: "Unassigned" },
  ];
}

function describeItemPosition(id) {
  const loc = locateItem(id);
  if (!loc) return "";
  const where = loc.tier ? "tier " + loc.tier.name : "Unassigned";
  return where + ", position " + (loc.index + 1) + " of " + loc.list.length;
}

function toggleGrab(kind, id) {
  if (runtime.grab && runtime.grab.id === id) return dropGrab();

  const origin = captureOrigin(kind, id);
  if (!origin) return;

  runtime.grab = { kind, id, origin };
  render();
  refocusGrabbed();

  if (kind === "tier") {
    const tier = getTier(id);
    announce("Picked up tier " + (tier ? tier.name : "") +
             ". Use up and down to move it, space to drop, escape to cancel.");
  } else {
    const item = getItem(id);
    announce("Picked up " + (item ? item.name : "") + ", " + describeItemPosition(id) +
             ". Use the arrow keys to move it, space to drop, escape to cancel.");
  }
}

function dropGrab() {
  const grab = runtime.grab;
  if (!grab) return false;
  runtime.grab = null;
  render();
  refocusGrabbed(grab);
  announce(grab.kind === "tier"
    ? "Tier dropped."
    : "Dropped in " + describeItemPosition(grab.id) + ".");
  return true;
}

function cancelGrab() {
  const grab = runtime.grab;
  if (!grab) return false;
  runtime.grab = null;

  if (grab.kind === "tier") {
    commit(() => {
      const index = state.tiers.findIndex(tier => tier.id === grab.id);
      if (index === -1) return;
      const [row] = state.tiers.splice(index, 1);
      state.tiers.splice(clamp(grab.origin.index, 0, state.tiers.length), 0, row);
    });
  } else {
    commit(() => {
      const loc = locateItem(grab.id);
      if (loc) loc.list.splice(loc.index, 1);
      const tier = grab.origin.zone === "pool" ? null : getTier(grab.origin.zone);
      const list = tier ? tier.items : state.pool;
      list.splice(clamp(grab.origin.index, 0, list.length), 0, grab.id);
    });
  }

  refocusGrabbed(grab);
  announce("Move cancelled.");
  return true;
}

function refocusGrabbed(grab = runtime.grab) {
  if (!grab) return;
  if (grab.kind === "tier") {
    const row = dom.tiers.querySelectorAll(".tier-grip")
      .find(node => node.dataset.tierId === grab.id);
    if (row) row.focus();
  } else {
    focusCard(grab.id);
  }
}

function focusCard(id) {
  const node = findCardNode(id);
  if (node) node.focus();
}

function moveGrabbedItem(dx, dy) {
  const grab = runtime.grab;
  const loc = locateItem(grab.id);
  if (!loc) return;

  if (dy !== 0) {
    const lists = itemLists();
    const from = loc.tier
      ? state.tiers.findIndex(tier => tier.id === loc.tier.id)
      : state.tiers.length;
    const to = clamp(from + dy, 0, lists.length - 1);
    if (to === from) return;

    commit(() => {
      loc.list.splice(loc.index, 1);
      const target = lists[to].list;
      target.splice(clamp(loc.index, 0, target.length), 0, grab.id);
    });
  } else {
    const to = clamp(loc.index + dx, 0, loc.list.length - 1);
    if (to === loc.index) return;

    commit(() => {
      loc.list.splice(loc.index, 1);
      loc.list.splice(to, 0, grab.id);
    });
  }

  focusCard(grab.id);
  announce(describeItemPosition(grab.id));
}

function moveGrabbedTier(dy) {
  const grab = runtime.grab;
  const from = state.tiers.findIndex(tier => tier.id === grab.id);
  const to = clamp(from + dy, 0, state.tiers.length - 1);
  if (from === -1 || to === from) return;

  commit(() => {
    const [row] = state.tiers.splice(from, 1);
    state.tiers.splice(to, 0, row);
  });

  refocusGrabbed();
  announce("Tier " + (getTier(grab.id) || {}).name + ", row " + (to + 1) +
           " of " + state.tiers.length);
}

/** Arrow keys walk between cards when nothing is held. */
function stepFocus(fromId, delta) {
  const order = allItemIds();
  const at = order.indexOf(fromId);
  if (at === -1) return;
  const next = order[clamp(at + delta, 0, order.length - 1)];
  if (next !== fromId) focusCard(next);
}

const ARROW_DELTA = {
  ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1],
};

function onCardKeyDown(event, itemId) {
  if (event.key === "Enter") {
    event.preventDefault();
    openPanel(itemId);
    return;
  }
  if (event.key === " " || event.key === "Spacebar") {
    event.preventDefault();
    toggleGrab("item", itemId);
    return;
  }

  const delta = ARROW_DELTA[event.key];
  if (!delta) return;
  event.preventDefault();

  const holding = runtime.grab && runtime.grab.kind === "item" && runtime.grab.id === itemId;
  if (holding) moveGrabbedItem(delta[0], delta[1]);
  else stepFocus(itemId, delta[0] || delta[1]);
}

function onGripKeyDown(event, tierId) {
  if (event.key === " " || event.key === "Spacebar" || event.key === "Enter") {
    event.preventDefault();
    toggleGrab("tier", tierId);
    return;
  }

  const delta = ARROW_DELTA[event.key];
  if (!delta || delta[1] === 0) return;
  if (!runtime.grab || runtime.grab.id !== tierId) return;
  event.preventDefault();
  moveGrabbedTier(delta[1]);
}

/* ==========================================================================
   10. EVENTS
   ========================================================================== */

/**
 * Wide viewports give the panel its own column and the board stays reachable,
 * so focus is free to leave. Narrow ones have it float over the board, where
 * tabbing to something underneath it would be tabbing into nowhere.
 */
/**
 * Text fields keep their own undo stack; hijacking Ctrl+Z inside one would
 * throw away a paragraph to undo a drag.
 */
function isUndoShortcut(event) {
  if (!(event.ctrlKey || event.metaKey) || event.altKey) return false;
  const key = event.key.toLowerCase();
  if (key !== "z" && key !== "y") return false;

  const active = document.activeElement;
  const tag = active && active.tagName ? active.tagName.toLowerCase() : "";
  return tag !== "input" && tag !== "textarea";
}

function isFileDrag(event) {
  const transfer = event.dataTransfer;
  return !!transfer && Array.prototype.includes.call(transfer.types || [], "Files");
}

function isPanelOverlaying() {
  return typeof window.matchMedia === "function" &&
         window.matchMedia("(max-width: 1100px)").matches;
}

function trapTab(event) {
  const focusable = dom.panel.querySelectorAll("input, textarea, button, [tabindex]");
  if (focusable.length === 0) return;

  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  const active = document.activeElement;

  if (event.shiftKey && (active === first || !dom.panel.contains(active))) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && active === last) {
    event.preventDefault();
    first.focus();
  }
}

function bindEvents() {
  dom.panelClose.addEventListener("click", closePanel);

  // Pasting an image anywhere in the panel attaches it, but only while the
  // item is actually in image mode — otherwise a paste into a textarea would
  // be hijacked.
  dom.panel.addEventListener("paste", event => {
    const item = runtime.panelOpen ? getItem(runtime.selectedItemId) : null;
    if (!item || item.shortType !== "image") return;

    const file = event.clipboardData && event.clipboardData.files[0];
    if (!file) return;
    event.preventDefault();
    attachImage(item.id, file);
  });

  dom.boardScroll.addEventListener("pointerdown", onBoardPointerDown);

  // Clicking bare board space dismisses the panel; clicking a card or a tier
  // control does not.
  dom.boardScroll.addEventListener("click", event => {
    if (!runtime.panelOpen) return;
    if (event.target.closest(".item, .tier-label, .tier-tools")) return;
    closePanel();
  });

  dom.title.classList.add("editable");
  dom.title.title = "Click to rename";
  dom.title.addEventListener("click", () => {
    startRename(dom.title, state.title, setTitle);
  });

  // Disarm a pending delete when attention moves elsewhere. This listens for
  // click rather than pointerdown so the clicked control's own handler runs
  // first — re-rendering on pointerdown would detach it mid-gesture.
  document.addEventListener("click", event => {
    if (!runtime.pendingDelete) return;
    if (event.target.closest(".confirming, .confirm-row, .icon-btn.danger")) return;
    clearPendingDelete();
  });

  // Only worth interrupting someone when their work genuinely is at risk.
  // With autosave working, closing the tab loses nothing, so the warning is
  // reserved for the case where nothing is being persisted.
  window.addEventListener("beforeunload", event => {
    if (!runtime.dirty || runtime.storage.available !== false) return;
    event.preventDefault();
    event.returnValue = "";
  });

  // Dropping an archive anywhere opens it. The panel's image drop zone stops
  // its own drops from reaching here.
  window.addEventListener("dragover", event => {
    if (isFileDrag(event)) event.preventDefault();
  });
  window.addEventListener("drop", event => {
    if (!isFileDrag(event)) return;
    event.preventDefault();
    const file = event.dataTransfer.files[0];
    if (file) requestImport(file);
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Tab" && runtime.panelOpen && isPanelOverlaying()) {
      trapTab(event);
      return;
    }
    if (isUndoShortcut(event)) {
      event.preventDefault();
      const moved = event.shiftKey || event.key.toLowerCase() === "y" ? redo() : undo();
      announce(moved
        ? (event.shiftKey ? "Redone." : "Undone.")
        : "Nothing left to " + (event.shiftKey ? "redo" : "undo") + ".");
      return;
    }

    if (event.key !== "Escape") return;
    if (runtime.drag) {
      releaseDragListeners();
      endDrag(false);
      return;
    }
    if (cancelGrab()) return;
    if (clearPendingDelete()) return;
    if (runtime.panelOpen) closePanel();
  });
}

/* ==========================================================================
   11. BOOT
   ========================================================================== */

async function boot() {
  cacheDom();
  bindEvents();

  // Paint the empty board immediately: opening the database can take a moment,
  // and a blank screen while it does would be worse than a brief default list.
  render();
  await restoreSession();
}

boot();
</script>
