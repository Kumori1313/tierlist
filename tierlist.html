<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tierlist</title>
<style>
/* ==========================================================================
   TOKENS
   ========================================================================== */

:root {
  color-scheme: dark light;

  /* Surfaces, dark by default */
  --bg:            #14161a;
  --surface:       #1b1e24;
  --surface-2:     #22262e;
  --surface-3:     #2b303a;
  --border:        #333945;
  --border-strong: #454c5b;

  /* Text */
  --text:          #e8eaef;
  --text-dim:      #a2a9b8;
  --text-faint:    #6c7382;
  --on-tier:       #14161a;   /* text drawn on top of a tier's colour */

  --accent:        #6ea8fe;
  --danger:        #f2637a;

  /* Spacing scale */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;

  /* Radii */
  --r1: 4px;
  --r2: 8px;
  --r3: 12px;

  /* Shadows */
  --shadow-1: 0 1px 2px rgb(0 0 0 / .3);
  --shadow-2: 0 4px 16px rgb(0 0 0 / .35);
  --shadow-3: 0 12px 40px rgb(0 0 0 / .45);

  /* Metrics */
  --tier-label-w: 108px;
  --tier-min-h:   104px;
  --card:         88px;       /* item card edge length */
  --panel-w:      400px;
  --header-h:     52px;

  /* Motion */
  --dur-fast: 90ms;
  --dur:      160ms;
  --dur-slow: 260ms;
  --ease:     cubic-bezier(.2, .7, .3, 1);
}

@media (prefers-color-scheme: light) {
  :root {
    --bg:            #f4f5f7;
    --surface:       #ffffff;
    --surface-2:     #f0f1f4;
    --surface-3:     #e4e6ec;
    --border:        #dcdfe6;
    --border-strong: #c3c8d4;

    --text:          #1c1f26;
    --text-dim:      #5c6474;
    --text-faint:    #8d95a5;
    --on-tier:       #14161a;

    --accent:        #2f6fdd;
    --danger:        #d33a55;

    --shadow-1: 0 1px 2px rgb(16 20 30 / .08);
    --shadow-2: 0 4px 16px rgb(16 20 30 / .10);
    --shadow-3: 0 12px 40px rgb(16 20 30 / .16);
  }
}

@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 0ms; --dur: 0ms; --dur-slow: 0ms; }
}

/* ==========================================================================
   BASE
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r1);
}

/* ==========================================================================
   APP SHELL
   ========================================================================== */

#app {
  display: grid;
  grid-template-rows: var(--header-h) auto 1fr;
  height: 100%;
}

/* --- banner --------------------------------------------------------------- */

#banner {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s2) var(--s4);
  border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-dim);
  font-size: 12px;
  z-index: 2;
}
#banner[hidden] { display: none; }
#banner.tone-warn {
  border-bottom-color: var(--danger);
  color: var(--text);
}
#banner.tone-warn::before {
  content: "";
  width: 3px;
  align-self: stretch;
  flex: none;
  border-radius: 2px;
  background: var(--danger);
}

.banner-text { flex: 1; min-width: 0; }

.banner-actions {
  display: flex;
  align-items: center;
  gap: var(--s2);
  flex: none;
}

/* --- header --------------------------------------------------------------- */

#header {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: 0 var(--s4);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 3;
}

#list-title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#toolbar {
  display: flex;
  align-items: center;
  gap: var(--s2);
}

.tool-btn {
  padding: 6px 11px;
  border-radius: var(--r1);
  color: var(--text-dim);
  background: var(--surface-2);
  border: 1px solid var(--border);
  white-space: nowrap;
  transition: background var(--dur-fast), color var(--dur-fast),
              border-color var(--dur-fast);
}
.tool-btn:hover {
  color: var(--text);
  background: var(--surface-3);
  border-color: var(--border-strong);
}
.tool-btn[disabled] {
  opacity: .4;
  cursor: default;
}
.tool-btn[disabled]:hover {
  color: var(--text-dim);
  background: var(--surface-2);
  border-color: var(--border);
}

/* --- main: board + detail panel ------------------------------------------ */

#main {
  display: grid;
  grid-template-columns: 1fr 0;
  min-height: 0;
  transition: grid-template-columns var(--dur-slow) var(--ease);
}
#main.panel-open { grid-template-columns: 1fr var(--panel-w); }

#board-scroll {
  min-width: 0;
  overflow: auto;
  overscroll-behavior: contain;
}

#board {
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s5);
  min-height: 100%;
}

/* ==========================================================================
   TIERS
   ========================================================================== */

#tiers {
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-radius: var(--r2);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--border);
}

.tier {
  display: grid;
  grid-template-columns: var(--tier-label-w) 1fr auto;
  min-height: var(--tier-min-h);
  background: var(--surface);
}

.tier-label {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: var(--s2);
  background: var(--tier-color, var(--surface-3));
  color: var(--on-tier);
  text-align: center;
  overflow: hidden;
}

/* Reordering a row needs its own handle: the label is also the rename target
   and the row is full of draggable cards. */
.tier-grip {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border-radius: var(--r1);
  background: rgb(0 0 0 / .12);
  color: var(--on-tier);
  font-size: 11px;
  line-height: 1;
  cursor: grab;
  opacity: 0;
  transition: opacity var(--dur);
  touch-action: manipulation;
}
.tier:hover .tier-grip,
.tier:focus-within .tier-grip { opacity: 1; }
.tier-grip:hover { background: rgb(0 0 0 / .28); }

@media (hover: none) {
  .tier-grip { opacity: 1; }
}

.tier-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.02em;
  overflow-wrap: anywhere;
  line-height: 1.15;
}

.tier-drop {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: var(--s2);
  padding: var(--s2);
  background: var(--surface);
}

/* Per-tier controls. The column is always laid out, so fading it in on hover
   never shifts the board; touch devices get it permanently. */
.tier-tools {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s1);
  padding: var(--s2) 6px;
  background: var(--surface);
  opacity: 0;
  transition: opacity var(--dur);
}
.tier:hover .tier-tools,
.tier:focus-within .tier-tools { opacity: 1; }

@media (hover: none) {
  .tier-tools { opacity: 1; }
}

.tier-color {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  padding: 0;
  background: none;
  border: 1px solid var(--border-strong);
  border-radius: var(--r1);
  cursor: pointer;
}
.tier-color::-webkit-color-swatch-wrapper { padding: 0; }
.tier-color::-webkit-color-swatch { border: 0; border-radius: 3px; }
.tier-color::-moz-color-swatch { border: 0; border-radius: 3px; }

/* ==========================================================================
   SHARED CONTROLS
   ========================================================================== */

.icon-btn {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  flex: none;
  border-radius: var(--r1);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-faint);
  font-size: 10px;
  line-height: 1;
  transition: color var(--dur-fast), background var(--dur-fast),
              border-color var(--dur-fast);
}
.icon-btn:hover {
  color: var(--text);
  background: var(--surface-3);
  border-color: var(--border-strong);
}
.icon-btn.danger:hover {
  color: var(--danger);
  border-color: var(--danger);
}

/* Text that becomes an input on click. */
.editable {
  border-radius: var(--r1);
  cursor: text;
}
.editable:hover { background: rgb(127 127 127 / .16); }

.inline-input {
  font: inherit;
  color: inherit;
  text-align: inherit;
  width: 100%;
  min-width: 0;
  padding: 1px 4px;
  border: 0;
  border-radius: var(--r1);
  background: rgb(127 127 127 / .22);
  outline: none;
}

/* Two-step delete confirmation, drawn inside the tier's label cell. */
.confirm-msg {
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
}
.confirm-sub {
  font-size: 9px;
  line-height: 1.2;
  opacity: .75;
}
.confirm-row {
  display: flex;
  gap: var(--s1);
}
.confirm-btn {
  padding: 3px 7px;
  border-radius: var(--r1);
  background: rgb(0 0 0 / .16);
  color: var(--on-tier);
  font-size: 10px;
  font-weight: 600;
}
.confirm-btn:hover { background: rgb(0 0 0 / .30); }

/* ==========================================================================
   POOL
   ========================================================================== */

#pool-section {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-faint);
}

#pool-drop {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: var(--s2);
  padding: var(--s2);
  min-height: var(--tier-min-h);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
}

/* --- empty states --------------------------------------------------------- */

.empty-hint {
  align-self: center;
  padding: 0 var(--s2);
  color: var(--text-faint);
  font-size: 12px;
  user-select: none;
}

/* ==========================================================================
   ITEM CARDS

   A card is a short-description body with a name footer. Phase 5 swaps the
   body for an image when the item's short type is "image".
   ========================================================================== */

.item {
  position: relative;
  width: var(--card);
  height: var(--card);
  display: flex;
  flex-direction: column;
  border-radius: var(--r2);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  overflow: hidden;
  user-select: none;
  cursor: grab;
  /* Touch keeps its normal panning: a drag needs a long press, and the
     engine calls preventDefault on touchmove once one is live. */
  touch-action: manipulation;
}

.item-body {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: var(--s2) 6px;
  color: var(--text-dim);
  font-size: 11px;
  line-height: 1.3;
  text-align: center;
  overflow: hidden;
}
.item-body > span {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.item-body.is-empty { color: var(--text-faint); font-style: italic; }
.item-body.is-image { padding: 0; }

.item-img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

/* With an image the name rides over the picture rather than sitting under it,
   so the image gets the whole card. */
.item.has-image .item-name {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 16px 6px 4px;
  border-top: 0;
  background: linear-gradient(to top, rgb(0 0 0 / .82), rgb(0 0 0 / .55) 55%, rgb(0 0 0 / 0));
  color: #fff;
  text-shadow: 0 1px 2px rgb(0 0 0 / .5);
}

.item-name {
  flex: none;
  padding: 4px 6px;
  background: var(--surface-3);
  border-top: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-name.editable:hover { background: var(--border); }

.item-tools {
  position: absolute;
  top: 3px;
  right: 3px;
  display: flex;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transition: opacity var(--dur);
}
.item:hover .item-tools,
.item:focus-within .item-tools { opacity: 1; }

@media (hover: none) {
  .item-tools { opacity: 1; }
}

.item-del.confirming {
  width: auto;
  padding: 0 6px;
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
  font-size: 9px;
  font-weight: 600;
}

/* ==========================================================================
   DRAGGING
   ========================================================================== */

#drag-layer {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
}

/* The dragged element stays in the flow as the live gap, dimmed to read as a
   hole rather than as content. */
.item.is-placeholder,
.tier.is-placeholder {
  opacity: .25;
  filter: saturate(.4);
}
.item.is-placeholder .item-tools,
.tier.is-placeholder .tier-tools,
.tier.is-placeholder .tier-grip { display: none; }

.drag-ghost {
  position: fixed;
  margin: 0;
  pointer-events: none;
  box-shadow: var(--shadow-3);
  opacity: .95;
  will-change: transform;
}
.drag-ghost .item-tools,
.drag-ghost .tier-tools,
.drag-ghost .tier-grip { display: none; }

body.is-dragging { cursor: grabbing; }
body.is-dragging .item,
body.is-dragging .tier-grip { cursor: grabbing; }
body.is-dragging .editable:hover { background: none; cursor: grabbing; }

/* Held by the keyboard rather than the pointer. Reads as lifted, not as the
   translucent hole a pointer drag leaves behind, because the thing itself is
   still where you are looking. */
.item.is-grabbed,
.tier.is-grabbed {
  position: relative;
  z-index: 1;
  outline: 2px dashed var(--accent);
  outline-offset: 2px;
  box-shadow: var(--shadow-2);
}
.tier-grip.is-grabbed {
  background: var(--accent);
  color: #fff;
  opacity: 1;
}

.tier-drop.is-drop-target,
#pool-drop.is-drop-target {
  background: var(--surface-2);
  box-shadow: inset 0 0 0 2px var(--accent);
}
#pool-drop.is-drop-target { border-color: var(--accent); }

/* ==========================================================================
   DETAIL PANEL
   Present in the DOM from the start; contents land in Phase 4.
   ========================================================================== */

#panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow: hidden;
  transform: translateX(100%);
  visibility: hidden;
  transition: transform var(--dur-slow) var(--ease),
              visibility var(--dur-slow);
}
#main.panel-open #panel {
  transform: none;
  visibility: visible;
}

#panel-head {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  height: var(--header-h);
  padding: 0 var(--s3);
  border-bottom: 1px solid var(--border);
  flex: none;
}

#panel-close {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: var(--r1);
  color: var(--text-dim);
  font-size: 16px;
  line-height: 1;
}
#panel-close:hover { color: var(--text); background: var(--surface-2); }

#panel-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: var(--s5);
  width: var(--panel-w);   /* keeps contents from reflowing during the slide */
  max-width: 100%;
}
#panel-body:focus { outline: none; }

.panel-title {
  width: 100%;
  padding: 0 0 var(--s2);
  border: 0;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.02em;
  outline: none;
}
.panel-title::placeholder { color: var(--text-faint); }

.panel-field { margin-top: var(--s5); }

.panel-label {
  display: block;
  margin-bottom: var(--s2);
  color: var(--text-faint);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.panel-hint {
  margin-top: var(--s2);
  color: var(--text-faint);
  font-size: 11px;
}

.panel-input {
  display: block;
  width: 100%;
  padding: var(--s3);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  line-height: 1.55;
  resize: none;
  overflow: hidden;         /* height is driven by content, see autoGrow */
  transition: border-color var(--dur-fast), background var(--dur-fast);
}
.panel-input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
}
.panel-desc { min-height: 150px; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* --- text / image switch --- */

.segmented {
  display: inline-flex;
  margin-bottom: var(--s3);
  padding: 2px;
  border: 1px solid var(--border);
  border-radius: var(--r2);
  background: var(--surface-2);
}

.seg {
  padding: 4px 14px;
  border-radius: 6px;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 600;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.seg:hover { color: var(--text); }
.seg.is-active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-1);
}

/* --- image editor --- */

.image-drop {
  display: grid;
  place-items: center;
  gap: var(--s2);
  padding: var(--s5) var(--s3);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r2);
  background: var(--surface-2);
  text-align: center;
  transition: border-color var(--dur-fast), background var(--dur-fast);
}
.image-drop.is-over {
  border-color: var(--accent);
  border-style: solid;
  background: var(--surface-3);
}
.image-drop.has-preview { padding: var(--s2); }

.image-drop-hint { color: var(--text-faint); font-size: 12px; }

.image-preview {
  display: block;
  max-width: 100%;
  max-height: 220px;
  border-radius: var(--r1);
  object-fit: contain;
}

.image-actions {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-top: var(--s2);
}
.image-meta {
  margin-left: auto;
  color: var(--text-faint);
  font-size: 11px;
  white-space: nowrap;
}

.panel-error {
  margin-top: var(--s2);
  padding: var(--s2) var(--s3);
  border: 1px solid var(--danger);
  border-radius: var(--r1);
  color: var(--danger);
  font-size: 12px;
}

.panel-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
  margin-top: var(--s6);
  padding-top: var(--s4);
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 12px;
}

.panel-where {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.panel-swatch {
  width: 10px;
  height: 10px;
  flex: none;
  border-radius: 3px;
  background: var(--tier-color, var(--surface-3));
}
.panel-where span {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.panel-delete {
  flex: none;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: var(--r1);
  color: var(--text-dim);
  font-size: 12px;
  transition: color var(--dur-fast), border-color var(--dur-fast),
              background var(--dur-fast);
}
.panel-delete:hover {
  color: var(--danger);
  border-color: var(--danger);
}
.panel-delete.confirming {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
}
.panel-delete.confirming:hover { color: #fff; }

/* The card whose details are open. */
.item.is-selected {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* ==========================================================================
   RESPONSIVE
   Below the breakpoint the panel overlays the board instead of pushing it.
   ========================================================================== */

@media (max-width: 1100px) {
  #main, #main.panel-open { grid-template-columns: 1fr 0; }
  #panel {
    position: fixed;
    top: var(--header-h);
    right: 0;
    bottom: 0;
    width: min(var(--panel-w), 100vw);
    z-index: 4;
    box-shadow: var(--shadow-3);
  }
}

@media (max-width: 700px) {
  :root {
    --tier-label-w: 72px;
    --tier-min-h: 88px;
    --card: 72px;
  }
  #board { padding: var(--s3); gap: var(--s4); }
  .tier-name { font-size: 17px; }
  #header { padding: 0 var(--s3); gap: var(--s2); }
  .tool-btn { padding: 6px 9px; }

  /* Too little width to wrap into: rows scroll sideways instead. */
  .tier-drop,
  #pool-drop {
    flex-wrap: nowrap;
    overflow-x: auto;
    overscroll-behavior-x: contain;
  }
  .item { flex: none; }

  /* The toolbar outgrows the header before the board outgrows the screen. */
  #toolbar {
    overflow-x: auto;
    scrollbar-width: none;
  }
  #toolbar::-webkit-scrollbar { display: none; }

  /* The panel becomes a sheet from the bottom, where a thumb can reach it. */
  #panel {
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    max-height: 82vh;
    border-left: 0;
    border-top: 1px solid var(--border);
    border-radius: var(--r3) var(--r3) 0 0;
    transform: translateY(100%);
  }
  #main.panel-open #panel { transform: none; }
  #panel-body { width: 100%; padding: var(--s4); }

  /* A grab handle for the sheet, purely as an affordance. */
  #panel-head::before {
    content: "";
    position: absolute;
    top: 8px;
    left: 50%;
    width: 36px;
    height: 4px;
    margin-left: -18px;
    border-radius: 2px;
    background: var(--border-strong);
  }
  #panel-head { position: relative; }
}
</style>
</head>
<body>

<div id="app">
  <header id="header">
    <div id="list-title"></div>
    <nav id="toolbar"></nav>
  </header>

  <div id="banner" hidden></div>

  <div id="main">
    <div id="board-scroll">
      <div id="board">
        <div id="tiers"></div>
        <section id="pool-section">
          <div class="section-label">Unassigned</div>
          <div id="pool-drop"></div>
        </section>
      </div>
    </div>

    <aside id="panel" aria-label="Item details" aria-hidden="true">
      <div id="panel-head">
        <button id="panel-close" type="button" title="Close (Esc)" aria-label="Close">✕</button>
      </div>
      <div id="panel-body" tabindex="-1"></div>
    </aside>
  </div>
</div>

<!-- Screen-reader announcements for moves that have no visual equivalent
     in the reading order. -->
<div id="live" class="visually-hidden" role="status" aria-live="polite"></div>

<!-- Dragged cards are rendered here, above everything and outside any
     scroll container or overflow clip. -->
<div id="drag-layer" aria-hidden="true"></div>

<script>
"use strict";

/* ==========================================================================
   1. CONSTANTS
   ========================================================================== */

const SCHEMA_VERSION = 1;

/* Conventional red -> green tier ramp. */
const DEFAULT_TIERS = [
  { name: "S", color: "#ff7f7f" },
  { name: "A", color: "#ffbf7f" },
  { name: "B", color: "#ffdf7f" },
  { name: "C", color: "#bfff7f" },
  { name: "D", color: "#7fffbf" },
];

/* Cycled through when a tier is added, continuing the ramp past D. */
const TIER_PALETTE = [
  "#7fdfff", "#9fbfff", "#bf9fff", "#ff9fdf", "#c9c9c9",
];

const DEFAULT_TIER_NAME = "New";
const DEFAULT_ITEM_NAME = "Untitled";

const ACCEPTED_IMAGE_TYPES = [
  "image/png", "image/jpeg", "image/webp", "image/gif", "image/avif",
];
const EXT_BY_MIME = {
  "image/png": ".png",
  "image/jpeg": ".jpg",
  "image/webp": ".webp",
  "image/gif": ".gif",
  "image/avif": ".avif",
};
/** Anything longer than this on its longest edge is re-encoded down to it. */
const MAX_IMAGE_EDGE = 1024;

/* ==========================================================================
   2. STATE

   `state` is the serializable document and matches the export schema exactly.
   `runtime` is everything that must never be written to a file: image blobs,
   object URLs, selection, transient UI flags.
   ========================================================================== */

let state = createEmptyDocument();

const runtime = {
  /** imagePath -> { blob, url, filename, mime, width, height } */
  images: new Map(),
  selectedItemId: null,
  panelOpen: false,
  /** true when the document has changed since the last export */
  dirty: false,
  /** armed two-step delete, e.g. "tier:tier_ab12" or "item:item_cd34" */
  pendingDelete: null,
  /** a press that has not yet travelled far enough to become a drag */
  pendingDrag: null,
  /** the live drag, see section 6 */
  drag: null,
  /** inline message shown in the detail panel, e.g. a rejected file */
  panelError: null,
  /** the notice strip under the header, see showBanner */
  banner: null,
  /** persistence, see section 8. `available` is null until probed. */
  storage: { available: null, db: null, error: null },
  /** keyboard pick-up, see section 9 */
  grab: null,
};

function createEmptyDocument() {
  const now = new Date().toISOString();
  return {
    schema: SCHEMA_VERSION,
    app: "tierlist",
    title: "Untitled Tier List",
    createdAt: now,
    modifiedAt: now,
    tiers: DEFAULT_TIERS.map(t => ({
      id: newId("tier"),
      name: t.name,
      color: t.color,
      items: [],
    })),
    pool: [],
    items: {},
    images: {},
  };
}

/* --- ids ------------------------------------------------------------------ */

/**
 * Short, collision-resistant enough for a single document. Not a UUID on
 * purpose: these end up inside the exported JSON and in archive filenames,
 * where being readable matters more than being globally unique.
 */
function newId(prefix) {
  const bytes = crypto.getRandomValues(new Uint8Array(6));
  let out = "";
  for (const b of bytes) out += b.toString(36).padStart(2, "0");
  return prefix + "_" + out;
}

/* --- mutation funnel ------------------------------------------------------ */

/**
 * The single entry point for changing the document. Everything goes through
 * here so that undo/redo (Phase 8) and autosave (Phase 7) have exactly one
 * seam to hook, rather than needing to chase down every mutation site.
 *
 * @param {() => void} mutate     performs the change against `state`
 * @param {object}     [opts]
 * @param {boolean}    [opts.silent]  skip the re-render (caller will do it)
 */
function commit(mutate, opts = {}) {
  if (!opts.skipHistory) pushHistory(opts.coalesce);
  mutate();
  if (history.evicted) {
    history.evicted = false;
    collectImages();
  }
  state.modifiedAt = new Date().toISOString();
  runtime.dirty = true;
  scheduleSave();
  if (!opts.silent) render();
}

/* --- history --------------------------------------------------------------
 *
 * Snapshots of the whole document rather than inverse operations: the document
 * is small, and every mutation already funnels through commit(), so there is
 * exactly one place to capture. Image bytes are not snapshotted — they live in
 * runtime.images and are kept alive as long as any snapshot still names them
 * (see releaseImage).
 */

const HISTORY_LIMIT = 60;
/** how long edits sharing a coalesce key fold into one undo step */
const COALESCE_MS = 1200;

const history = { past: [], future: [], lastKey: null, lastAt: 0, evicted: false };

function snapshot() {
  return typeof structuredClone === "function"
    ? structuredClone(state)
    : JSON.parse(JSON.stringify(state));
}

/**
 * @param {string} [key] edits sharing a key in quick succession — typing in
 *   one field — collapse into a single undo step instead of one per keystroke.
 */
function pushHistory(key) {
  const now = Date.now();
  if (key && key === history.lastKey && now - history.lastAt < COALESCE_MS) {
    history.lastAt = now;
    return;
  }

  history.past.push(snapshot());
  if (history.past.length > HISTORY_LIMIT) {
    history.past.shift();
    // That snapshot may have been an image's last reference — but the sweep
    // has to wait until after the mutation, or it would collect an image the
    // caller is in the middle of attaching.
    history.evicted = true;
  }
  history.future.length = 0;
  history.lastKey = key || null;
  history.lastAt = now;
}

function clearHistory() {
  history.past.length = 0;
  history.future.length = 0;
  history.lastKey = null;
  collectImages();
}

/**
 * Sweeps image bytes nothing can reach any more. Needed because an image can
 * become unreachable without anyone touching it — when the snapshot that was
 * its last reference falls off the end of the history.
 */
function collectImages() {
  for (const path of [...runtime.images.keys()]) releaseImage(path);
}

function stepHistory(from, to) {
  if (from.length === 0) return false;
  to.push(snapshot());
  state = from.pop();
  history.lastKey = null;
  runtime.dirty = true;
  runtime.grab = null;
  if (!getItem(runtime.selectedItemId)) {
    runtime.panelOpen = false;
    runtime.selectedItemId = null;
  }
  scheduleSave();
  render();
  return true;
}

const undo = () => stepHistory(history.past, history.future);
const redo = () => stepHistory(history.future, history.past);

/* --- lookups -------------------------------------------------------------- */

function getItem(id) {
  return state.items[id] || null;
}

function getTier(id) {
  return state.tiers.find(t => t.id === id) || null;
}

/** Every item id on the board, tiers first then the pool, in visual order. */
function allItemIds() {
  const ids = [];
  for (const tier of state.tiers) ids.push(...tier.items);
  ids.push(...state.pool);
  return ids;
}

/**
 * Finds the list an item currently sits in.
 * @returns {{ list: string[], index: number, tier: object|null } | null}
 */
function locateItem(id) {
  for (const tier of state.tiers) {
    const index = tier.items.indexOf(id);
    if (index !== -1) return { list: tier.items, index, tier };
  }
  const index = state.pool.indexOf(id);
  if (index !== -1) return { list: state.pool, index, tier: null };
  return null;
}

/* ==========================================================================
   3. DOM HELPERS
   ==========================================================================

   Elements are built rather than assembled from HTML strings, so user text
   can never be interpreted as markup. */

const $ = sel => document.querySelector(sel);

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key === "style") applyStyle(node, value);
    else if (key === "dataset") Object.assign(node.dataset, value);
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of [].concat(children)) {
    if (child == null || child === false) continue;
    node.append(child);
  }
  return node;
}

/** Custom properties need setProperty — assigning to style[key] drops them. */
function applyStyle(node, styles) {
  for (const [key, value] of Object.entries(styles)) {
    if (key.startsWith("--")) node.style.setProperty(key, value);
    else node.style[key] = value;
  }
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

/**
 * Swaps a text element's contents for an input. Enter or blur commits, Escape
 * reverts. Shared by the list title, tier names and item names.
 */
function startRename(target, current, onCommit) {
  if (target.dataset.editing) return;
  target.dataset.editing = "1";

  const input = el("input", {
    class: "inline-input",
    type: "text",
    value: current,
    "aria-label": "Name",
  });
  target.replaceChildren(input);
  input.focus();
  input.select();

  let settled = false;
  const finish = save => {
    if (settled) return;
    settled = true;
    delete target.dataset.editing;
    const next = input.value.trim();
    if (save && next && next !== current) onCommit(next);
    else render();
  };

  input.addEventListener("keydown", event => {
    // Escape must not reach the document handler and close the panel too.
    event.stopPropagation();
    if (event.key === "Enter") { event.preventDefault(); finish(true); }
    else if (event.key === "Escape") { event.preventDefault(); finish(false); }
  });
  input.addEventListener("blur", () => finish(true));
}

/* ==========================================================================
   4. ACTIONS

   Every document mutation lives here and routes through commit().
   ========================================================================== */

function setTitle(title) {
  commit(() => { state.title = title; });
}

/* --- tiers ---------------------------------------------------------------- */

function addTier() {
  commit(() => {
    state.tiers.push({
      id: newId("tier"),
      name: DEFAULT_TIER_NAME,
      color: TIER_PALETTE[state.tiers.length % TIER_PALETTE.length],
      items: [],
    });
  });
}

function renameTier(id, name) {
  commit(() => { const tier = getTier(id); if (tier) tier.name = name; });
}

function recolorTier(id, color) {
  commit(() => { const tier = getTier(id); if (tier) tier.color = color; });
}

/** Items outlive their tier — deleting a row returns its contents to the pool. */
function deleteTier(id) {
  commit(() => {
    const index = state.tiers.findIndex(tier => tier.id === id);
    if (index === -1) return;
    state.pool.push(...state.tiers[index].items);
    state.tiers.splice(index, 1);
  });
}

/* --- items ---------------------------------------------------------------- */

function addItem() {
  const id = newId("item");
  commit(() => {
    state.items[id] = {
      id,
      name: DEFAULT_ITEM_NAME + " " + (Object.keys(state.items).length + 1),
      shortType: "text",
      shortText: "",
      image: null,
      description: "",
      accent: null,
    };
    state.pool.push(id);
  });
  return id;
}

/**
 * Applies an edit made in the detail panel.
 *
 * Deliberately does not re-render: the board is rebuilt wholesale by render(),
 * which would tear the focused field out from under the caret on every
 * keystroke. Only the affected card is refreshed, and only once typing pauses.
 */
function updateItem(id, mutate, field) {
  commit(() => {
    const item = getItem(id);
    if (item) mutate(item);
  }, { silent: true, coalesce: field ? "item:" + id + ":" + field : undefined });
  scheduleCardRefresh(id);
}

let cardRefreshTimer = 0;

function scheduleCardRefresh(id) {
  clearTimeout(cardRefreshTimer);
  cardRefreshTimer = setTimeout(() => refreshItemCard(id), 120);
}

function refreshItemCard(id) {
  const node = findCardNode(id);
  const item = getItem(id);
  if (node && item) node.replaceWith(renderItem(item));
}

function deleteItem(id) {
  // Drop the selection first so commit()'s render closes the panel in the
  // same pass rather than needing a second one.
  if (runtime.selectedItemId === id) {
    runtime.panelOpen = false;
    runtime.selectedItemId = null;
  }

  const item = getItem(id);
  const image = item ? item.image : null;

  commit(() => {
    const loc = locateItem(id);
    if (loc) loc.list.splice(loc.index, 1);
    delete state.items[id];
  });

  releaseImage(image);
}

/* --- images ---------------------------------------------------------------
 *
 * State only ever holds an item's archive path, e.g. "images/img_9f2c.webp".
 * The bytes live in runtime.images, keyed by that same path, alongside the
 * object URL the card renders from. Export (Phase 6) writes those blobs into
 * the archive at exactly the path the manifest names, so the mapping between
 * item and file is explicit rather than positional.
 */

/**
 * Validates, optionally downscales, and packages a picked file. Registers
 * nothing — the caller decides whether to keep the result.
 */
async function readImageFile(file) {
  if (!ACCEPTED_IMAGE_TYPES.includes(file.type)) {
    const what = file.type ? "a " + file.type + " file" : "not an image";
    throw new Error("That's " + what + ". Use PNG, JPEG, WebP, GIF or AVIF.");
  }

  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch (cause) {
    throw new Error("That image could not be read — it may be corrupt.");
  }

  let { width, height } = bitmap;
  let blob = file;
  let mime = file.type;

  const longest = Math.max(width, height);
  // GIFs are passed through untouched: a canvas round-trip keeps the first
  // frame and silently throws away the animation.
  if (longest > MAX_IMAGE_EDGE && file.type !== "image/gif") {
    const scale = MAX_IMAGE_EDGE / longest;
    const w = Math.round(width * scale);
    const h = Math.round(height * scale);

    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);

    blob = await canvasToBlob(canvas, "image/webp", 0.9);
    mime = blob.type || "image/webp";
    width = w;
    height = h;
  }

  if (bitmap.close) bitmap.close();

  return {
    path: "images/" + newId("img") + (EXT_BY_MIME[mime] || ".bin"),
    blob,
    meta: { filename: file.name, mime, bytes: blob.size, width, height },
  };
}

function canvasToBlob(canvas, type, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      blob => blob ? resolve(blob) : reject(new Error("Could not re-encode that image.")),
      type, quality);
  });
}

/** Attaches a picked file to an item, switching it to image mode. */
async function attachImage(itemId, file) {
  runtime.panelError = null;

  let imported;
  try {
    imported = await readImageFile(file);
  } catch (error) {
    runtime.panelError = error.message;
    renderPanel();
    return;
  }

  const previous = getItem(itemId) ? getItem(itemId).image : null;

  runtime.images.set(imported.path, {
    blob: imported.blob,
    url: URL.createObjectURL(imported.blob),
    ...imported.meta,
  });

  commit(() => {
    const item = getItem(itemId);
    if (!item) return;
    item.image = imported.path;
    item.shortType = "image";
    state.images[imported.path] = imported.meta;
  });

  if (previous !== imported.path) releaseImage(previous);
}

function removeImage(itemId) {
  const item = getItem(itemId);
  const previous = item ? item.image : null;

  commit(() => {
    const target = getItem(itemId);
    if (!target) return;
    target.image = null;
    target.shortType = "text";
  });

  releaseImage(previous);
}

/**
 * Switches which of the two short descriptions is live. Non-destructive: the
 * inactive one keeps its value, so toggling back and forth loses nothing.
 */
function setShortType(itemId, type) {
  commit(() => {
    const item = getItem(itemId);
    if (item) item.shortType = type;
  });
}

/**
 * Frees an image's bytes and URL once nothing points at it any more — which
 * includes undo history, or undoing a removal would restore an item pointing
 * at bytes that had already been freed.
 */
function releaseImage(path) {
  if (!path) return;

  const referencedBy = doc => Object.values(doc.items || {}).some(item => item.image === path);
  if (referencedBy(state)) return;
  if (history.past.some(referencedBy) || history.future.some(referencedBy)) return;

  const entry = runtime.images.get(path);
  if (entry) {
    URL.revokeObjectURL(entry.url);
    runtime.images.delete(path);
  }
  delete state.images[path];
}

/* --- two-step delete ------------------------------------------------------ */

function armDelete(key) {
  runtime.pendingDelete = key;
  render();
}

/** @returns {boolean} whether anything was armed */
function clearPendingDelete() {
  if (!runtime.pendingDelete) return false;
  runtime.pendingDelete = null;
  render();
  return true;
}

/* ==========================================================================
   5. RENDER

   The whole board is rebuilt on every commit. That is fine at this size;
   Phase 4 introduces targeted card updates once typing in the detail panel
   makes full re-renders wasteful.
   ========================================================================== */

const dom = {};

function cacheDom() {
  dom.main       = $("#main");
  dom.banner     = $("#banner");
  dom.boardScroll = $("#board-scroll");
  dom.dragLayer  = $("#drag-layer");
  dom.live       = $("#live");
  dom.title      = $("#list-title");
  dom.toolbar    = $("#toolbar");
  dom.tiers      = $("#tiers");
  dom.poolDrop   = $("#pool-drop");
  dom.panel      = $("#panel");
  dom.panelBody  = $("#panel-body");
  dom.panelClose = $("#panel-close");
}

function render() {
  renderHeader();
  renderBanner();
  renderTiers();
  renderPool();
  renderPanel();
}

/* --- header --------------------------------------------------------------- */

function renderHeader() {
  if (!dom.title.dataset.editing) dom.title.textContent = state.title;

  clear(dom.toolbar);

  const picker = el("input", {
    type: "file",
    class: "visually-hidden",
    accept: ".tierlist,.zip,application/zip",
    onchange: event => {
      const file = event.target.files[0];
      if (file) requestImport(file);
      event.target.value = "";     // picking the same file twice must re-fire
    },
  });

  dom.toolbar.append(
    el("button", { class: "tool-btn", type: "button", text: "Add item", onclick: () => addItem() }),
    el("button", { class: "tool-btn", type: "button", text: "Add tier", onclick: addTier }),
    picker,
    el("button", {
      class: "tool-btn", type: "button", text: "New", title: "Start an empty list",
      onclick: newList,
    }),
    el("button", {
      class: "tool-btn", type: "button", text: "Open", title: "Open a .tierlist file",
      onclick: () => picker.click(),
    }),
    el("button", {
      class: "tool-btn", type: "button", text: "Save", title: "Download this list as a .tierlist file",
      onclick: exportList,
    }),
    el("button", {
      class: "tool-btn", type: "button", text: "PNG", title: "Download a picture of the ranking",
      onclick: exportSnapshot,
    }),
  );
}

function renderBanner() {
  const banner = runtime.banner;
  clear(dom.banner);
  dom.banner.hidden = !banner;
  if (!banner) return;

  dom.banner.className = "tone-" + (banner.tone || "info");
  dom.banner.append(el("div", { class: "banner-text", text: banner.text }));

  const actions = el("div", { class: "banner-actions" });
  for (const action of banner.actions || []) {
    actions.append(el("button", {
      class: "tool-btn", type: "button", text: action.label, onclick: action.onClick,
    }));
  }
  actions.append(el("button", {
    class: "icon-btn", type: "button", text: "✕", title: "Dismiss", onclick: dismissBanner,
  }));
  dom.banner.append(actions);
}

/* --- tiers ---------------------------------------------------------------- */

function renderTiers() {
  clear(dom.tiers);
  dom.tiers.setAttribute("role", "list");
  dom.tiers.setAttribute("aria-label", "Tiers");
  for (const tier of state.tiers) {
    dom.tiers.append(renderTier(tier));
  }
}

function renderTier(tier) {
  const confirming = runtime.pendingDelete === "tier:" + tier.id;
  const grabbed = runtime.grab && runtime.grab.kind === "tier" && runtime.grab.id === tier.id;

  const label = el("div", {
    class: "tier-label",
    style: { "--tier-color": tier.color },
  }, confirming ? renderTierConfirm(tier) : [
    el("button", {
      class: "tier-grip" + (grabbed ? " is-grabbed" : ""),
      type: "button",
      title: "Drag, or press space to move with the arrow keys",
      "aria-label": "Reorder tier " + (tier.name || "untitled"),
      "aria-pressed": grabbed ? "true" : "false",
      dataset: { tierId: tier.id },
      text: "⠿",
      onkeydown: event => onGripKeyDown(event, tier.id),
    }),
    el("div", {
      class: "tier-name editable",
      text: tier.name,
      title: "Click to rename",
      onclick: event => startRename(
        event.currentTarget, tier.name, name => renameTier(tier.id, name)),
    }),
  ]);

  const drop = el("div", {
    class: "tier-drop",
    role: "list",
    "aria-label": (tier.name || "Untitled") + " tier",
    dataset: { dropZone: "tier", tierId: tier.id },
  });

  if (tier.items.length === 0) {
    drop.append(el("div", { class: "empty-hint", text: "Drop items here" }));
  } else {
    for (const id of tier.items) {
      const item = getItem(id);
      if (item) drop.append(renderItem(item));
    }
  }

  const tools = el("div", { class: "tier-tools" }, [
    el("input", {
      class: "tier-color",
      type: "color",
      value: tier.color,
      title: "Tier colour",
      onchange: event => recolorTier(tier.id, event.target.value),
    }),
    el("button", {
      class: "icon-btn danger",
      type: "button",
      text: "✕",
      title: "Delete tier",
      onclick: () => armDelete("tier:" + tier.id),
    }),
  ]);

  return el("div", {
    class: "tier" + (grabbed ? " is-grabbed" : ""),
    role: "listitem",
    dataset: { tierId: tier.id },
  }, [label, drop, tools]);
}

/** Confirmation drawn into the tier's label cell, which has room for words. */
function renderTierConfirm(tier) {
  const count = tier.items.length;
  return [
    el("div", { class: "confirm-msg", text: "Delete tier?" }),
    count > 0 && el("div", {
      class: "confirm-sub",
      text: count + (count === 1 ? " item" : " items") + " → Unassigned",
    }),
    el("div", { class: "confirm-row" }, [
      el("button", {
        class: "confirm-btn", type: "button", text: "Delete",
        onclick: () => { runtime.pendingDelete = null; deleteTier(tier.id); },
      }),
      el("button", {
        class: "confirm-btn", type: "button", text: "Cancel",
        onclick: clearPendingDelete,
      }),
    ]),
  ];
}

/* --- pool ----------------------------------------------------------------- */

function renderPool() {
  clear(dom.poolDrop);
  dom.poolDrop.dataset.dropZone = "pool";

  dom.poolDrop.setAttribute("role", "list");
  dom.poolDrop.setAttribute("aria-label", "Unassigned items");

  if (state.pool.length === 0) {
    const nothingAnywhere = Object.keys(state.items).length === 0;
    dom.poolDrop.append(el("div", {
      class: "empty-hint",
      text: nothingAnywhere
        ? "Nothing here yet — use “Add item” to start, then drag items into a tier."
        : "Unranked items collect here.",
    }));
    return;
  }

  for (const id of state.pool) {
    const item = getItem(id);
    if (item) dom.poolDrop.append(renderItem(item));
  }
}

/* --- item cards ----------------------------------------------------------- */

function renderItem(item) {
  const confirming = runtime.pendingDelete === "item:" + item.id;
  const imageMode = item.shortType === "image";
  const entry = imageMode && item.image ? runtime.images.get(item.image) : null;

  let body;
  if (entry) {
    body = el("div", { class: "item-body is-image" }, [
      el("img", { class: "item-img", src: entry.url, alt: "", draggable: "false" }),
    ]);
  } else if (imageMode) {
    // Image mode with nothing to show: either not picked yet, or the archive
    // arrived without the file (see the importer's repair pass in Phase 6).
    body = el("div", { class: "item-body is-empty" }, [
      el("span", { text: item.image ? "image missing" : "no image" }),
    ]);
  } else {
    const short = (item.shortText || "").trim();
    body = el("div", { class: "item-body" + (short ? "" : " is-empty") }, [
      el("span", { text: short || "—" }),
    ]);
  }

  // Renaming lives in the detail panel, which is the single editing surface
  // for everything about an item.
  const name = el("div", { class: "item-name", text: item.name });

  const tools = el("div", { class: "item-tools" }, [
    el("button", {
      class: "icon-btn danger item-del" + (confirming ? " confirming" : ""),
      type: "button",
      text: confirming ? "Delete?" : "✕",
      title: confirming ? "Click again to delete" : "Delete item",
      onclick: () => {
        if (!confirming) return armDelete("item:" + item.id);
        runtime.pendingDelete = null;
        deleteItem(item.id);
      },
    }),
  ]);

  const selected = runtime.panelOpen && runtime.selectedItemId === item.id;
  const grabbed = runtime.grab && runtime.grab.kind === "item" && runtime.grab.id === item.id;

  return el("div", {
    class: "item" + (selected ? " is-selected" : "") + (entry ? " has-image" : "") +
           (grabbed ? " is-grabbed" : ""),
    role: "listitem",
    dataset: { itemId: item.id },
    tabindex: "0",
    title: item.name,
    "aria-label": item.name + ", " + describeItemPosition(item.id) +
                  ". Enter for details, space to move.",
    "aria-grabbed": grabbed ? "true" : "false",
    onclick: event => {
      if (event.target.closest(".item-tools")) return;
      openPanel(item.id);
    },
    onkeydown: event => onCardKeyDown(event, item.id),
  }, [tools, body, name]);
}

function findCardNode(id) {
  for (const node of dom.boardScroll.querySelectorAll(".item")) {
    if (node.dataset.itemId === id) return node;
  }
  return null;
}

/* --- detail panel --------------------------------------------------------- */

function renderPanel() {
  const item = runtime.panelOpen ? getItem(runtime.selectedItemId) : null;
  const open = item != null;

  dom.main.classList.toggle("panel-open", open);
  dom.panel.setAttribute("aria-hidden", open ? "false" : "true");

  clear(dom.panelBody);
  if (!open) return;

  const loc = locateItem(item.id);
  const tier = loc ? loc.tier : null;
  const armed = runtime.pendingDelete === "item:" + item.id;

  const title = el("input", {
    class: "panel-title",
    type: "text",
    value: item.name,
    placeholder: "Untitled",
    "aria-label": "Item name",
    oninput: event => updateItem(item.id, draft => { draft.name = event.target.value; }),
  });

  const short = el("textarea", {
    class: "panel-input panel-short",
    rows: "2",
    placeholder: "Shown on the card",
    "aria-label": "Short description",
    oninput: event => {
      autoGrow(event.target);
      updateItem(item.id, draft => { draft.shortText = event.target.value; }, "shortText");
    },
  });
  short.value = item.shortText || "";

  const description = el("textarea", {
    class: "panel-input panel-desc",
    placeholder: "Anything worth saying at length…",
    "aria-label": "Description",
    oninput: event => {
      autoGrow(event.target);
      updateItem(item.id, draft => { draft.description = event.target.value; }, "description");
    },
  });
  description.value = item.description || "";

  const meta = el("div", { class: "panel-meta" }, [
    el("div", {
      class: "panel-where",
      style: tier ? { "--tier-color": tier.color } : {},
    }, [
      el("span", { class: "panel-swatch" }),
      el("span", { text: tier ? tier.name : "Unassigned" }),
    ]),
    el("button", {
      class: "panel-delete" + (armed ? " confirming" : ""),
      type: "button",
      text: armed ? "Delete for good?" : "Delete item",
      onclick: () => {
        if (!armed) return armDelete("item:" + item.id);
        runtime.pendingDelete = null;
        deleteItem(item.id);
      },
    }),
  ]);

  dom.panelBody.append(
    title,
    el("div", { class: "panel-field" }, [
      el("label", { class: "panel-label", text: "Short description" }),
      renderShortTypeSwitch(item),
      item.shortType === "image" ? renderImageEditor(item) : short,
      el("div", {
        class: "panel-hint",
        text: item.shortType === "image"
          ? "The image fills the card in place of any text."
          : "Displayed on the card itself.",
      }),
      runtime.panelError && el("div", { class: "panel-error", text: runtime.panelError }),
    ]),
    el("div", { class: "panel-field" }, [
      el("label", { class: "panel-label", text: "Description" }),
      description,
    ]),
    meta,
  );

  autoGrow(short);
  autoGrow(description);
}

/** Text or image — one or the other, never both. */
function renderShortTypeSwitch(item) {
  const option = (type, label) => el("button", {
    class: "seg" + (item.shortType === type ? " is-active" : ""),
    type: "button",
    text: label,
    "aria-pressed": item.shortType === type ? "true" : "false",
    onclick: () => setShortType(item.id, type),
  });

  return el("div", {
    class: "segmented",
    role: "group",
    "aria-label": "Short description type",
  }, [option("text", "Text"), option("image", "Image")]);
}

function renderImageEditor(item) {
  const entry = item.image ? runtime.images.get(item.image) : null;

  const picker = el("input", {
    type: "file",
    class: "visually-hidden",
    accept: ACCEPTED_IMAGE_TYPES.join(","),
    onchange: event => {
      const file = event.target.files[0];
      if (file) attachImage(item.id, file);
    },
  });

  // The one place the native drag-and-drop API earns its keep: files coming
  // in from outside the page.
  const drop = el("div", {
    class: "image-drop" + (entry ? " has-preview" : ""),
    ondragover: event => {
      event.preventDefault();
      event.currentTarget.classList.add("is-over");
    },
    ondragleave: event => event.currentTarget.classList.remove("is-over"),
    ondrop: event => {
      event.preventDefault();
      event.stopPropagation();   // not an archive drop, see the window handler
      event.currentTarget.classList.remove("is-over");
      const file = event.dataTransfer.files[0];
      if (file) attachImage(item.id, file);
    },
  }, entry ? [
    el("img", { class: "image-preview", src: entry.url, alt: "" }),
  ] : [
    el("div", { class: "image-drop-hint", text: "Drop an image here, or paste one" }),
    el("button", {
      class: "tool-btn", type: "button", text: "Choose a file",
      onclick: () => picker.click(),
    }),
  ]);

  const meta = entry && state.images[item.image];

  return el("div", { class: "image-editor" }, [
    picker,
    drop,
    entry && el("div", { class: "image-actions" }, [
      el("button", {
        class: "tool-btn", type: "button", text: "Replace",
        onclick: () => picker.click(),
      }),
      el("button", {
        class: "tool-btn", type: "button", text: "Remove",
        onclick: () => removeImage(item.id),
      }),
      meta && el("div", {
        class: "image-meta",
        text: meta.width + "×" + meta.height + " · " + formatBytes(meta.bytes),
      }),
    ]),
  ]);
}

function formatBytes(bytes) {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

/** Textareas grow with their content instead of scrolling internally. */
function autoGrow(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + "px";
}

function openPanel(itemId) {
  runtime.selectedItemId = itemId;
  runtime.panelOpen = true;
  runtime.panelError = null;
  render();               // selection outlines change across the whole board
  dom.panelBody.focus();

  const item = getItem(itemId);
  announce("Details for " + (item ? item.name : "item") + ". Press escape to close.");
}

function closePanel() {
  const wasShowing = runtime.selectedItemId;
  runtime.panelOpen = false;
  runtime.panelError = null;
  render();

  // Hand focus back to where it came from.
  const card = findCardNode(wasShowing);
  if (card) card.focus();
}

/* ==========================================================================
   6. DRAGGING

   Pointer Events rather than the HTML5 drag-and-drop API: consistent on
   touch, and the drag image is a real element we can style.

   The dragged element doubles as the placeholder — it is moved around the DOM
   during the drag to preview the drop, while a clone follows the pointer. On
   release the affected lists are read back out of the DOM, so what was
   previewed is exactly what is committed. Nothing touches `state` until the
   drop, which makes cancelling a matter of re-rendering.

   One engine, two kinds:
     "item"  cards, moving between tier drop zones and the pool, laid out in
             wrapping rows so the insertion scan is two-dimensional
     "tier"  whole rows, reordering within #tiers, vertical only

   Starting a drag differs by input: a mouse needs a few pixels of travel, a
   touch needs a long press, so that a finger on a card still scrolls the page.
   ========================================================================== */

const DRAG_THRESHOLD = 5;        // px of travel before a press becomes a drag
const LONG_PRESS_MS = 400;       // touch hold before a press becomes a drag
const TOUCH_SLOP = 10;           // px of travel that abandons the long press
const AUTOSCROLL_EDGE = 64;      // px band at the board's edges
const AUTOSCROLL_MAX = 22;       // px per frame at the very edge

function onBoardPointerDown(event) {
  if (runtime.drag || runtime.pendingDrag) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;

  const grip = event.target.closest(".tier-grip");
  const node = grip ? event.target.closest(".tier") : event.target.closest(".item");
  if (!node) return;
  // Controls and an in-progress rename own their own gestures.
  if (!grip && event.target.closest(".item-tools, .inline-input")) return;

  const pending = {
    kind: grip ? "tier" : "item",
    node,
    pointerId: event.pointerId,
    pointerType: event.pointerType,
    startX: event.clientX,
    startY: event.clientY,
    timer: 0,
  };
  runtime.pendingDrag = pending;

  window.addEventListener("pointermove", onDragPointerMove);
  window.addEventListener("pointerup", onDragPointerUp);
  window.addEventListener("pointercancel", onDragPointerCancel);
  // Non-passive: once a touch drag is live, the page must stop scrolling
  // underneath it.
  window.addEventListener("touchmove", onDragTouchMove, { passive: false });

  if (event.pointerType !== "mouse") {
    pending.timer = setTimeout(() => {
      if (runtime.pendingDrag !== pending) return;
      beginDrag(pending, { clientX: pending.startX, clientY: pending.startY });
      if (navigator.vibrate) navigator.vibrate(12);
    }, LONG_PRESS_MS);
  }
}

function onDragPointerMove(event) {
  const pending = runtime.pendingDrag;

  if (pending && !runtime.drag) {
    if (event.pointerId !== pending.pointerId) return;
    const travelled = Math.hypot(event.clientX - pending.startX,
                                 event.clientY - pending.startY);

    if (pending.pointerType === "mouse") {
      if (travelled < DRAG_THRESHOLD) return;
      beginDrag(pending, event);
    } else {
      // Moving before the hold completes means this was a scroll, not a drag.
      if (travelled > TOUCH_SLOP) releaseDragListeners();
      return;
    }
  }

  const drag = runtime.drag;
  if (!drag || event.pointerId !== drag.pointerId) return;
  drag.pointerX = event.clientX;
  drag.pointerY = event.clientY;
  event.preventDefault();
}

function onDragTouchMove(event) {
  if (runtime.drag) event.preventDefault();
}

function onDragPointerUp(event) {
  if (runtime.pendingDrag && event.pointerId !== runtime.pendingDrag.pointerId) return;
  const wasDragging = runtime.drag != null;
  releaseDragListeners();
  if (wasDragging) {
    endDrag(true);
    swallowNextClick();   // a drag must not also fire the card's click handlers
  }
}

function onDragPointerCancel() {
  releaseDragListeners();
  if (runtime.drag) endDrag(false);
}

function releaseDragListeners() {
  if (runtime.pendingDrag && runtime.pendingDrag.timer) {
    clearTimeout(runtime.pendingDrag.timer);
  }
  runtime.pendingDrag = null;
  window.removeEventListener("pointermove", onDragPointerMove);
  window.removeEventListener("pointerup", onDragPointerUp);
  window.removeEventListener("pointercancel", onDragPointerCancel);
  window.removeEventListener("touchmove", onDragTouchMove);
}

function beginDrag(pending, event) {
  if (pending.timer) clearTimeout(pending.timer);

  const node = pending.node;
  const isTier = pending.kind === "tier";
  const rect = node.getBoundingClientRect();

  const ghost = node.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.classList.remove("is-placeholder");
  Object.assign(ghost.style, {
    left: rect.left + "px",
    top: rect.top + "px",
    width: rect.width + "px",
    height: rect.height + "px",
  });
  dom.dragLayer.append(ghost);

  node.classList.add("is-placeholder");
  document.body.classList.add("is-dragging");

  const zone = isTier ? dom.tiers : node.parentNode;
  if (!isTier) {
    // "Empty" hints would otherwise take up room in the zones being dropped
    // into. The next render puts them back.
    for (const hint of dom.boardScroll.querySelectorAll(".empty-hint")) hint.remove();
    zone.classList.add("is-drop-target");
  }

  runtime.drag = {
    kind: pending.kind,
    node,
    ghost,
    zone,
    originZone: zone,
    // A full-width row tilted a few degrees looks broken; a card does not.
    ghostTransform: isTier ? " scale(1.01)" : " rotate(2.5deg) scale(1.04)",
    pointerId: pending.pointerId,
    startX: pending.startX,
    startY: pending.startY,
    pointerX: event.clientX,
    pointerY: event.clientY,
    zones: isTier ? [] : [...dom.boardScroll.querySelectorAll("[data-drop-zone]")],
    frame: 0,
  };
  runtime.drag.frame = requestAnimationFrame(dragFrame);
}

/**
 * One loop for the whole drag rather than work on each pointermove: it keeps
 * the ghost in sync at the display's rate, and it means auto-scroll keeps
 * running while the pointer is held still at the edge.
 */
function dragFrame() {
  const drag = runtime.drag;
  if (!drag) return;

  drag.ghost.style.transform =
    "translate(" + (drag.pointerX - drag.startX) + "px," +
                   (drag.pointerY - drag.startY) + "px)" + drag.ghostTransform;

  autoScroll(drag);
  if (drag.kind === "tier") updateTierPlaceholder(drag);
  else updateItemPlaceholder(drag);

  drag.frame = requestAnimationFrame(dragFrame);
}

function autoScroll(drag) {
  const rect = dom.boardScroll.getBoundingClientRect();
  let dy = 0;

  if (drag.pointerY < rect.top + AUTOSCROLL_EDGE) {
    const depth = (rect.top + AUTOSCROLL_EDGE - drag.pointerY) / AUTOSCROLL_EDGE;
    dy = -AUTOSCROLL_MAX * Math.min(1, depth);
  } else if (drag.pointerY > rect.bottom - AUTOSCROLL_EDGE) {
    const depth = (drag.pointerY - (rect.bottom - AUTOSCROLL_EDGE)) / AUTOSCROLL_EDGE;
    dy = AUTOSCROLL_MAX * Math.min(1, depth);
  }

  if (dy) dom.boardScroll.scrollTop += dy;
}

/** Rects are read fresh each frame: moving the placeholder reflows the board. */
function zoneAt(drag, x, y) {
  for (const zone of drag.zones) {
    const rect = zone.getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      return zone;
    }
  }
  return null;
}

/**
 * The card the placeholder should sit before, or null to append.
 *
 * Cards wrap onto multiple rows, so the scan is row-major: skip rows entirely
 * above the pointer, then within the pointer's row take the first card whose
 * horizontal midpoint the pointer has not yet passed. Running off the end of a
 * row falls through to the next row's first card, whose top is below the
 * pointer — which is the correct answer for "past the end of this row".
 */
function insertionRef(zone, placeholder, x, y) {
  for (const card of zone.children) {
    if (card === placeholder || !card.classList.contains("item")) continue;
    const rect = card.getBoundingClientRect();
    if (y > rect.bottom) continue;
    if (y < rect.top) return card;
    if (x < rect.left + rect.width / 2) return card;
  }
  return null;
}

function updateItemPlaceholder(drag) {
  const zone = zoneAt(drag, drag.pointerX, drag.pointerY);

  if (zone !== drag.zone) {
    if (drag.zone) drag.zone.classList.remove("is-drop-target");
    if (zone) zone.classList.add("is-drop-target");
    drag.zone = zone;
  }

  // Outside every zone: leave the preview where it was, so releasing there
  // drops the item back at its last valid position rather than nowhere.
  if (!zone) return;

  const before = insertionRef(zone, drag.node, drag.pointerX, drag.pointerY);
  if (before === drag.node) return;
  if (drag.node.parentNode === zone && drag.node.nextSibling === before) return;
  zone.insertBefore(drag.node, before);
}

/* --- tier rows ------------------------------------------------------------ */

/**
 * The row the placeholder should sit before, or null to append.
 *
 * Deliberately measured with offsetTop rather than getBoundingClientRect:
 * rows carry FLIP transforms mid-animation, and hit-testing against animated
 * positions makes the decision feed back into itself and flicker. Layout
 * position is the stable truth.
 */
function tierInsertionRef(container, placeholder, pointerY) {
  const y = pointerY - container.getBoundingClientRect().top;

  for (const row of container.children) {
    if (row === placeholder) continue;
    const top = row.offsetTop - container.offsetTop;
    if (y < top + row.offsetHeight / 2) return row;
  }
  return null;
}

function updateTierPlaceholder(drag) {
  const before = tierInsertionRef(dom.tiers, drag.node, drag.pointerY);
  if (before === drag.node) return;
  if (drag.node.nextSibling === before) return;

  flipRows(dom.tiers, drag.node, () => dom.tiers.insertBefore(drag.node, before));
}

/**
 * Moves rows via `mutate`, then animates them from where they were to where
 * they now are. Reading the "before" rects after any in-flight transform means
 * a gap that moves twice in quick succession animates from its visual position
 * rather than snapping.
 */
function flipRows(container, exclude, mutate) {
  const rows = [...container.children].filter(row => row !== exclude);
  const before = rows.map(row => row.getBoundingClientRect().top);

  mutate();

  const after = rows.map(row => row.getBoundingClientRect().top);
  rows.forEach((row, i) => {
    const delta = before[i] - after[i];
    if (!delta) return;
    row.style.transition = "none";
    row.style.transform = "translateY(" + delta + "px)";
    requestAnimationFrame(() => {
      row.style.transition = "transform var(--dur) var(--ease)";
      row.style.transform = "";
    });
  });
}

/** @param {boolean} keep  commit the previewed position, or discard it */
function endDrag(keep) {
  const drag = runtime.drag;
  if (!drag) return;
  runtime.drag = null;

  cancelAnimationFrame(drag.frame);
  drag.ghost.remove();
  document.body.classList.remove("is-dragging");
  if (drag.kind === "item" && drag.zone) drag.zone.classList.remove("is-drop-target");
  drag.node.classList.remove("is-placeholder");

  if (!keep) {
    // `state` was never touched, so a re-render is the whole undo — it also
    // clears any FLIP transforms still sitting on the rows.
    render();
    return;
  }

  if (drag.kind === "tier") {
    commit(syncTiersFromDom);
    return;
  }

  const touched = new Set([drag.originZone, drag.node.parentNode]);
  commit(() => {
    for (const zone of touched) syncListFromDom(zone);
  });
}

/** Adopts the DOM's row order as the truth for state.tiers. */
function syncTiersFromDom() {
  const byId = new Map(state.tiers.map(tier => [tier.id, tier]));
  const ordered = [];
  for (const row of dom.tiers.children) {
    const tier = byId.get(row.dataset.tierId);
    if (tier) ordered.push(tier);
  }
  if (ordered.length !== state.tiers.length) return;   // never lose a row
  state.tiers = ordered;
}

function listForZone(zone) {
  if (!zone || !zone.dataset) return null;
  if (zone.dataset.dropZone === "pool") return state.pool;
  const tier = getTier(zone.dataset.tierId);
  return tier ? tier.items : null;
}

/** Adopts the DOM's card order as the truth for that zone's list. */
function syncListFromDom(zone) {
  const list = listForZone(zone);
  if (!list) return;
  const ids = [];
  for (const node of zone.children) {
    if (node.classList.contains("item")) ids.push(node.dataset.itemId);
  }
  list.length = 0;
  list.push(...ids);
}

function swallowNextClick() {
  const swallow = event => {
    event.stopPropagation();
    event.preventDefault();
  };
  window.addEventListener("click", swallow, { capture: true, once: true });
  // Touch may never produce the click; don't leave the trap armed for the
  // user's next real one.
  setTimeout(() => window.removeEventListener("click", swallow, { capture: true }), 350);
}

/* ==========================================================================
   7. ARCHIVE

   Export and import, with a hand-written ZIP so the page stays dependency
   free. The format needed here is small: a local header per file, a central
   directory, and an end-of-central-directory record. Compression is native —
   CompressionStream('deflate-raw') — and falls back to storing when a browser
   lacks it, which stays a perfectly valid ZIP.

   Reading parses the central directory rather than walking local headers, so
   archives produced by other tools load too.
   ========================================================================== */

const MANIFEST_NAME = "tierlist.json";
const ZIP_SIG_LOCAL = 0x04034b50;
const ZIP_SIG_CENTRAL = 0x02014b50;
const ZIP_SIG_EOCD = 0x06054b50;

/* --- crc32 ---------------------------------------------------------------- */

let crcTable = null;

function crc32(bytes) {
  if (!crcTable) {
    crcTable = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      crcTable[i] = c >>> 0;
    }
  }
  let crc = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) {
    crc = crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
  }
  return (crc ^ 0xffffffff) >>> 0;
}

/* --- deflate -------------------------------------------------------------- */

function hasCompressionStreams() {
  return typeof CompressionStream === "function" &&
         typeof DecompressionStream === "function";
}

async function pipeThrough(bytes, transform) {
  const stream = new Blob([bytes]).stream().pipeThrough(transform);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

const deflateRaw = bytes => pipeThrough(bytes, new CompressionStream("deflate-raw"));
const inflateRaw = bytes => pipeThrough(bytes, new DecompressionStream("deflate-raw"));

/* --- writing -------------------------------------------------------------- */

/** DOS packs a timestamp into two 16-bit words, with two-second resolution. */
function dosDateTime(date) {
  const year = Math.max(1980, date.getFullYear());
  return {
    time: (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1),
    date: ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate(),
  };
}

/**
 * @param {{name: string, data: Uint8Array, compress?: boolean}[]} entries
 * @returns {Promise<Uint8Array>} the complete archive
 */
async function buildZip(entries) {
  const encoder = new TextEncoder();
  const stamp = dosDateTime(new Date());
  const parts = [];
  const directory = [];
  let offset = 0;

  for (const entry of entries) {
    const nameBytes = encoder.encode(entry.name);
    const crc = crc32(entry.data);

    let method = 0;
    let payload = entry.data;
    // Images are already compressed formats; deflating them wastes time for
    // a fraction of a percent. Only the manifest asks for it.
    if (entry.compress && hasCompressionStreams()) {
      const deflated = await deflateRaw(entry.data);
      if (deflated.length < entry.data.length) {
        method = 8;
        payload = deflated;
      }
    }

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, ZIP_SIG_LOCAL, true);
    lv.setUint16(4, 20, true);            // version needed
    lv.setUint16(6, 0x0800, true);        // flags: names are UTF-8
    lv.setUint16(8, method, true);
    lv.setUint16(10, stamp.time, true);
    lv.setUint16(12, stamp.date, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, payload.length, true);
    lv.setUint32(22, entry.data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);            // no extra field
    local.set(nameBytes, 30);

    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, ZIP_SIG_CENTRAL, true);
    cv.setUint16(4, 20, true);            // version made by
    cv.setUint16(6, 20, true);            // version needed
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, method, true);
    cv.setUint16(12, stamp.time, true);
    cv.setUint16(14, stamp.date, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, payload.length, true);
    cv.setUint32(24, entry.data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);            // extra
    cv.setUint16(32, 0, true);            // comment
    cv.setUint16(34, 0, true);            // disk number
    cv.setUint16(36, 0, true);            // internal attrs
    cv.setUint32(38, 0, true);            // external attrs
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);

    parts.push(local, payload);
    directory.push(central);
    offset += local.length + payload.length;

    if (offset > 0xffffffff) {
      throw new Error("This list is too large to save as a ZIP archive.");
    }
  }

  const directorySize = directory.reduce((sum, part) => sum + part.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, ZIP_SIG_EOCD, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, directorySize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);              // no archive comment

  const all = [...parts, ...directory, eocd];
  const total = all.reduce((sum, part) => sum + part.length, 0);
  const out = new Uint8Array(total);
  let cursor = 0;
  for (const part of all) {
    out.set(part, cursor);
    cursor += part.length;
  }
  return out;
}

/* --- reading -------------------------------------------------------------- */

/**
 * @param {Uint8Array} bytes
 * @returns {Map<string, {method: number, raw: Uint8Array, size: number}>}
 */
function readZip(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);

  // The EOCD sits at the end, but a trailing comment can push it back by up
  // to 64K, so scan backwards for the signature.
  let eocd = -1;
  const floor = Math.max(0, bytes.length - (22 + 0xffff));
  for (let i = bytes.length - 22; i >= floor; i--) {
    if (view.getUint32(i, true) === ZIP_SIG_EOCD) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("That file is not a ZIP archive.");

  const count = view.getUint16(eocd + 10, true);
  let ptr = view.getUint32(eocd + 16, true);

  const decoder = new TextDecoder();
  const files = new Map();

  for (let i = 0; i < count; i++) {
    if (ptr + 46 > bytes.length || view.getUint32(ptr, true) !== ZIP_SIG_CENTRAL) {
      throw new Error("This archive's directory is damaged.");
    }
    const method = view.getUint16(ptr + 10, true);
    const compressedSize = view.getUint32(ptr + 20, true);
    const size = view.getUint32(ptr + 24, true);
    const nameLength = view.getUint16(ptr + 28, true);
    const extraLength = view.getUint16(ptr + 30, true);
    const commentLength = view.getUint16(ptr + 32, true);
    const localOffset = view.getUint32(ptr + 42, true);

    let name = decoder.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLength));
    if (name.startsWith("./")) name = name.slice(2);

    // The local header repeats the name and extra fields, and other writers
    // pad them differently — read the real lengths rather than assuming ours.
    if (view.getUint32(localOffset, true) !== ZIP_SIG_LOCAL) {
      throw new Error("This archive's file headers are damaged.");
    }
    const localNameLength = view.getUint16(localOffset + 26, true);
    const localExtraLength = view.getUint16(localOffset + 28, true);
    const start = localOffset + 30 + localNameLength + localExtraLength;

    if (!name.endsWith("/")) {
      files.set(name, {
        method,
        size,
        raw: bytes.subarray(start, start + compressedSize),
      });
    }
    ptr += 46 + nameLength + extraLength + commentLength;
  }

  return files;
}

async function unpack(entry) {
  if (entry.method === 0) return entry.raw;
  if (entry.method === 8) {
    if (!hasCompressionStreams()) {
      throw new Error("This browser cannot decompress that archive.");
    }
    return inflateRaw(entry.raw);
  }
  throw new Error("Unsupported compression in this archive (method " + entry.method + ").");
}

/* --- export --------------------------------------------------------------- */

/**
 * The document as it should be written. Images are kept when some item names
 * them, whether or not that item is currently in image mode — a retained
 * image must survive the round trip.
 */
function serializeDocument() {
  const referenced = new Set();
  for (const item of Object.values(state.items)) {
    if (item.image) referenced.add(item.image);
  }

  const images = {};
  for (const [path, meta] of Object.entries(state.images)) {
    if (referenced.has(path) && runtime.images.has(path)) images[path] = meta;
  }

  return {
    ...state,
    schema: SCHEMA_VERSION,
    app: "tierlist",
    modifiedAt: new Date().toISOString(),
    images,
  };
}

function slugify(text) {
  const slug = (text || "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 60);
  return slug || "tierlist";
}

async function buildArchiveBytes() {
  const manifest = serializeDocument();
  const encoder = new TextEncoder();

  const entries = [{
    name: MANIFEST_NAME,
    data: encoder.encode(JSON.stringify(manifest, null, 2)),
    compress: true,
  }];

  for (const path of Object.keys(manifest.images)) {
    const held = runtime.images.get(path);
    const buffer = await held.blob.arrayBuffer();
    entries.push({ name: path, data: new Uint8Array(buffer), compress: false });
  }

  return buildZip(entries);
}

async function exportList() {
  try {
    const bytes = await buildArchiveBytes();
    downloadBlob(new Blob([bytes], { type: "application/zip" }),
                 slugify(state.title) + ".tierlist");
    runtime.dirty = false;
  } catch (error) {
    showBanner({ tone: "warn", text: "Could not save: " + error.message });
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = el("a", { href: url, download: filename });
  document.body.append(link);
  link.click();
  link.remove();
  // Give the browser a moment to start the download before pulling the URL.
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* --- snapshot ------------------------------------------------------------
 *
 * A one-way PNG of the ranking, for sharing. Drawn onto a canvas by hand
 * rather than via SVG foreignObject, which cannot reach blob: images and
 * would not carry the page's CSS anyway. The pool is deliberately left out:
 * this is a picture of the ranking, not of the workspace.
 */

const SNAP = {
  scale: 2,
  pad: 14,
  gap: 8,
  card: 96,
  label: 132,
  maxColumns: 12,
  titleBand: 56,
  ink: "#14161a",
  bg: "#14161a",
  row: "#1b1e24",
  cardBg: "#22262e",
  cardEdge: "#333945",
  text: "#e8eaef",
