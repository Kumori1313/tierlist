<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tierlist</title>
<style>
/* ==========================================================================
   TOKENS
   ========================================================================== */

:root {
  color-scheme: dark light;

  /* Surfaces, dark by default */
  --bg:            #14161a;
  --surface:       #1b1e24;
  --surface-2:     #22262e;
  --surface-3:     #2b303a;
  --border:        #333945;
  --border-strong: #454c5b;

  /* Text */
  --text:          #e8eaef;
  --text-dim:      #a2a9b8;
  --text-faint:    #6c7382;
  --on-tier:       #14161a;   /* text drawn on top of a tier's colour */

  --accent:        #6ea8fe;
  --danger:        #f2637a;

  /* Spacing scale */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;

  /* Radii */
  --r1: 4px;
  --r2: 8px;
  --r3: 12px;

  /* Shadows */
  --shadow-1: 0 1px 2px rgb(0 0 0 / .3);
  --shadow-2: 0 4px 16px rgb(0 0 0 / .35);
  --shadow-3: 0 12px 40px rgb(0 0 0 / .45);

  /* Metrics */
  --tier-label-w: 108px;
  --tier-min-h:   104px;
  --card:         88px;       /* item card edge length */
  --panel-w:      400px;
  --header-h:     52px;

  /* Motion */
  --dur-fast: 90ms;
  --dur:      160ms;
  --dur-slow: 260ms;
  --ease:     cubic-bezier(.2, .7, .3, 1);
}

@media (prefers-color-scheme: light) {
  :root {
    --bg:            #f4f5f7;
    --surface:       #ffffff;
    --surface-2:     #f0f1f4;
    --surface-3:     #e4e6ec;
    --border:        #dcdfe6;
    --border-strong: #c3c8d4;

    --text:          #1c1f26;
    --text-dim:      #5c6474;
    --text-faint:    #8d95a5;
    --on-tier:       #14161a;

    --accent:        #2f6fdd;
    --danger:        #d33a55;

    --shadow-1: 0 1px 2px rgb(16 20 30 / .08);
    --shadow-2: 0 4px 16px rgb(16 20 30 / .10);
    --shadow-3: 0 12px 40px rgb(16 20 30 / .16);
  }
}

@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 0ms; --dur: 0ms; --dur-slow: 0ms; }
}

/* ==========================================================================
   BASE
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r1);
}

/* ==========================================================================
   APP SHELL
   ========================================================================== */

#app {
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  height: 100%;
}

/* --- header --------------------------------------------------------------- */

#header {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: 0 var(--s4);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 3;
}

#list-title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#toolbar {
  display: flex;
  align-items: center;
  gap: var(--s2);
}

.tool-btn {
  padding: 6px 11px;
  border-radius: var(--r1);
  color: var(--text-dim);
  background: var(--surface-2);
  border: 1px solid var(--border);
  white-space: nowrap;
  transition: background var(--dur-fast), color var(--dur-fast),
              border-color var(--dur-fast);
}
.tool-btn:hover {
  color: var(--text);
  background: var(--surface-3);
  border-color: var(--border-strong);
}
.tool-btn[disabled] {
  opacity: .4;
  cursor: default;
}
.tool-btn[disabled]:hover {
  color: var(--text-dim);
  background: var(--surface-2);
  border-color: var(--border);
}

/* --- main: board + detail panel ------------------------------------------ */

#main {
  display: grid;
  grid-template-columns: 1fr 0;
  min-height: 0;
  transition: grid-template-columns var(--dur-slow) var(--ease);
}
#main.panel-open { grid-template-columns: 1fr var(--panel-w); }

#board-scroll {
  min-width: 0;
  overflow: auto;
  overscroll-behavior: contain;
}

#board {
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s5);
  min-height: 100%;
}

/* ==========================================================================
   TIERS
   ========================================================================== */

#tiers {
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-radius: var(--r2);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--border);
}

.tier {
  display: grid;
  grid-template-columns: var(--tier-label-w) 1fr auto;
  min-height: var(--tier-min-h);
  background: var(--surface);
}

.tier-label {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: var(--s2);
  background: var(--tier-color, var(--surface-3));
  color: var(--on-tier);
  text-align: center;
  overflow: hidden;
}

/* Reordering a row needs its own handle: the label is also the rename target
   and the row is full of draggable cards. */
.tier-grip {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border-radius: var(--r1);
  background: rgb(0 0 0 / .12);
  color: var(--on-tier);
  font-size: 11px;
  line-height: 1;
  cursor: grab;
  opacity: 0;
  transition: opacity var(--dur);
  touch-action: manipulation;
}
.tier:hover .tier-grip,
.tier:focus-within .tier-grip { opacity: 1; }
.tier-grip:hover { background: rgb(0 0 0 / .28); }

@media (hover: none) {
  .tier-grip { opacity: 1; }
}

.tier-name {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.02em;
  overflow-wrap: anywhere;
  line-height: 1.15;
}

.tier-drop {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: var(--s2);
  padding: var(--s2);
  background: var(--surface);
}

/* Per-tier controls. The column is always laid out, so fading it in on hover
   never shifts the board; touch devices get it permanently. */
.tier-tools {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s1);
  padding: var(--s2) 6px;
  background: var(--surface);
  opacity: 0;
  transition: opacity var(--dur);
}
.tier:hover .tier-tools,
.tier:focus-within .tier-tools { opacity: 1; }

@media (hover: none) {
  .tier-tools { opacity: 1; }
}

.tier-color {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  padding: 0;
  background: none;
  border: 1px solid var(--border-strong);
  border-radius: var(--r1);
  cursor: pointer;
}
.tier-color::-webkit-color-swatch-wrapper { padding: 0; }
.tier-color::-webkit-color-swatch { border: 0; border-radius: 3px; }
.tier-color::-moz-color-swatch { border: 0; border-radius: 3px; }

/* ==========================================================================
   SHARED CONTROLS
   ========================================================================== */

.icon-btn {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  flex: none;
  border-radius: var(--r1);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-faint);
  font-size: 10px;
  line-height: 1;
  transition: color var(--dur-fast), background var(--dur-fast),
              border-color var(--dur-fast);
}
.icon-btn:hover {
  color: var(--text);
  background: var(--surface-3);
  border-color: var(--border-strong);
}
.icon-btn.danger:hover {
  color: var(--danger);
  border-color: var(--danger);
}

/* Text that becomes an input on click. */
.editable {
  border-radius: var(--r1);
  cursor: text;
}
.editable:hover { background: rgb(127 127 127 / .16); }

.inline-input {
  font: inherit;
  color: inherit;
  text-align: inherit;
  width: 100%;
  min-width: 0;
  padding: 1px 4px;
  border: 0;
  border-radius: var(--r1);
  background: rgb(127 127 127 / .22);
  outline: none;
}

/* Two-step delete confirmation, drawn inside the tier's label cell. */
.confirm-msg {
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
}
.confirm-sub {
  font-size: 9px;
  line-height: 1.2;
  opacity: .75;
}
.confirm-row {
  display: flex;
  gap: var(--s1);
}
.confirm-btn {
  padding: 3px 7px;
  border-radius: var(--r1);
  background: rgb(0 0 0 / .16);
  color: var(--on-tier);
  font-size: 10px;
  font-weight: 600;
}
.confirm-btn:hover { background: rgb(0 0 0 / .30); }

/* ==========================================================================
   POOL
   ========================================================================== */

#pool-section {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-faint);
}

#pool-drop {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: var(--s2);
  padding: var(--s2);
  min-height: var(--tier-min-h);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r2);
}

/* --- empty states --------------------------------------------------------- */

.empty-hint {
  align-self: center;
  padding: 0 var(--s2);
  color: var(--text-faint);
  font-size: 12px;
  user-select: none;
}

/* ==========================================================================
   ITEM CARDS

   A card is a short-description body with a name footer. Phase 5 swaps the
   body for an image when the item's short type is "image".
   ========================================================================== */

.item {
  position: relative;
  width: var(--card);
  height: var(--card);
  display: flex;
  flex-direction: column;
  border-radius: var(--r2);
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  overflow: hidden;
  user-select: none;
  cursor: grab;
  /* Touch keeps its normal panning: a drag needs a long press, and the
     engine calls preventDefault on touchmove once one is live. */
  touch-action: manipulation;
}

.item-body {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: var(--s2) 6px;
  color: var(--text-dim);
  font-size: 11px;
  line-height: 1.3;
  text-align: center;
  overflow: hidden;
}
.item-body > span {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
  overflow-wrap: anywhere;
}
.item-body.is-empty { color: var(--text-faint); font-style: italic; }

.item-name {
  flex: none;
  padding: 4px 6px;
  background: var(--surface-3);
  border-top: 1px solid var(--border);
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-name.editable:hover { background: var(--border); }

.item-tools {
  position: absolute;
  top: 3px;
  right: 3px;
  display: flex;
  align-items: center;
  gap: 2px;
  opacity: 0;
  transition: opacity var(--dur);
}
.item:hover .item-tools,
.item:focus-within .item-tools { opacity: 1; }

@media (hover: none) {
  .item-tools { opacity: 1; }
}

.item-del.confirming {
  width: auto;
  padding: 0 6px;
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
  font-size: 9px;
  font-weight: 600;
}

/* ==========================================================================
   DRAGGING
   ========================================================================== */

#drag-layer {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
}

/* The dragged element stays in the flow as the live gap, dimmed to read as a
   hole rather than as content. */
.item.is-placeholder,
.tier.is-placeholder {
  opacity: .25;
  filter: saturate(.4);
}
.item.is-placeholder .item-tools,
.tier.is-placeholder .tier-tools,
.tier.is-placeholder .tier-grip { display: none; }

.drag-ghost {
  position: fixed;
  margin: 0;
  pointer-events: none;
  box-shadow: var(--shadow-3);
  opacity: .95;
  will-change: transform;
}
.drag-ghost .item-tools,
.drag-ghost .tier-tools,
.drag-ghost .tier-grip { display: none; }

body.is-dragging { cursor: grabbing; }
body.is-dragging .item,
body.is-dragging .tier-grip { cursor: grabbing; }
body.is-dragging .editable:hover { background: none; cursor: grabbing; }

.tier-drop.is-drop-target,
#pool-drop.is-drop-target {
  background: var(--surface-2);
  box-shadow: inset 0 0 0 2px var(--accent);
}
#pool-drop.is-drop-target { border-color: var(--accent); }

/* ==========================================================================
   DETAIL PANEL
   Present in the DOM from the start; contents land in Phase 4.
   ========================================================================== */

#panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow: hidden;
  transform: translateX(100%);
  visibility: hidden;
  transition: transform var(--dur-slow) var(--ease),
              visibility var(--dur-slow);
}
#main.panel-open #panel {
  transform: none;
  visibility: visible;
}

#panel-head {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  height: var(--header-h);
  padding: 0 var(--s3);
  border-bottom: 1px solid var(--border);
  flex: none;
}

#panel-close {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: var(--r1);
  color: var(--text-dim);
  font-size: 16px;
  line-height: 1;
}
#panel-close:hover { color: var(--text); background: var(--surface-2); }

#panel-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: var(--s5) var(--s4);
  width: var(--panel-w);   /* keeps contents from reflowing during the slide */
  max-width: 100%;
}

/* ==========================================================================
   RESPONSIVE
   Below the breakpoint the panel overlays the board instead of pushing it.
   ========================================================================== */

@media (max-width: 1100px) {
  #main, #main.panel-open { grid-template-columns: 1fr 0; }
  #panel {
    position: fixed;
    top: var(--header-h);
    right: 0;
    bottom: 0;
    width: min(var(--panel-w), 100vw);
    z-index: 4;
    box-shadow: var(--shadow-3);
  }
}

@media (max-width: 700px) {
  :root {
    --tier-label-w: 72px;
    --tier-min-h: 88px;
    --card: 72px;
  }
  #board { padding: var(--s3); gap: var(--s4); }
  .tier-name { font-size: 17px; }
  #header { padding: 0 var(--s3); gap: var(--s2); }
  .tool-btn { padding: 6px 9px; }
}
</style>
</head>
<body>

<div id="app">
  <header id="header">
    <div id="list-title"></div>
    <nav id="toolbar"></nav>
  </header>

  <div id="main">
    <div id="board-scroll">
      <div id="board">
        <div id="tiers"></div>
        <section id="pool-section">
          <div class="section-label">Unassigned</div>
          <div id="pool-drop"></div>
        </section>
      </div>
    </div>

    <aside id="panel" aria-label="Item details" aria-hidden="true">
      <div id="panel-head">
        <button id="panel-close" type="button" title="Close (Esc)" aria-label="Close">✕</button>
      </div>
      <div id="panel-body"></div>
    </aside>
  </div>
</div>

<!-- Dragged cards are rendered here, above everything and outside any
     scroll container or overflow clip. -->
<div id="drag-layer" aria-hidden="true"></div>

<script>
"use strict";

/* ==========================================================================
   1. CONSTANTS
   ========================================================================== */

const SCHEMA_VERSION = 1;

/* Conventional red -> green tier ramp. */
const DEFAULT_TIERS = [
  { name: "S", color: "#ff7f7f" },
  { name: "A", color: "#ffbf7f" },
  { name: "B", color: "#ffdf7f" },
  { name: "C", color: "#bfff7f" },
  { name: "D", color: "#7fffbf" },
];

/* Cycled through when a tier is added, continuing the ramp past D. */
const TIER_PALETTE = [
  "#7fdfff", "#9fbfff", "#bf9fff", "#ff9fdf", "#c9c9c9",
];

const DEFAULT_TIER_NAME = "New";
const DEFAULT_ITEM_NAME = "Untitled";

/* ==========================================================================
   2. STATE

   `state` is the serializable document and matches the export schema exactly.
   `runtime` is everything that must never be written to a file: image blobs,
   object URLs, selection, transient UI flags.
   ========================================================================== */

let state = createEmptyDocument();

const runtime = {
  /** imagePath -> { blob, url, filename, mime, width, height } */
  images: new Map(),
  selectedItemId: null,
  panelOpen: false,
  /** true when the document has changed since the last export */
  dirty: false,
  /** armed two-step delete, e.g. "tier:tier_ab12" or "item:item_cd34" */
  pendingDelete: null,
  /** a press that has not yet travelled far enough to become a drag */
  pendingDrag: null,
  /** the live drag, see section 6 */
  drag: null,
};

function createEmptyDocument() {
  const now = new Date().toISOString();
  return {
    schema: SCHEMA_VERSION,
    app: "tierlist",
    title: "Untitled Tier List",
    createdAt: now,
    modifiedAt: now,
    tiers: DEFAULT_TIERS.map(t => ({
      id: newId("tier"),
      name: t.name,
      color: t.color,
      items: [],
    })),
    pool: [],
    items: {},
    images: {},
  };
}

/* --- ids ------------------------------------------------------------------ */

/**
 * Short, collision-resistant enough for a single document. Not a UUID on
 * purpose: these end up inside the exported JSON and in archive filenames,
 * where being readable matters more than being globally unique.
 */
function newId(prefix) {
  const bytes = crypto.getRandomValues(new Uint8Array(6));
  let out = "";
  for (const b of bytes) out += b.toString(36).padStart(2, "0");
  return prefix + "_" + out;
}

/* --- mutation funnel ------------------------------------------------------ */

/**
 * The single entry point for changing the document. Everything goes through
 * here so that undo/redo (Phase 8) and autosave (Phase 7) have exactly one
 * seam to hook, rather than needing to chase down every mutation site.
 *
 * @param {() => void} mutate     performs the change against `state`
 * @param {object}     [opts]
 * @param {boolean}    [opts.silent]  skip the re-render (caller will do it)
 */
function commit(mutate, opts = {}) {
  // Phase 8: push a snapshot onto the undo stack here, before mutating.
  mutate();
  state.modifiedAt = new Date().toISOString();
  runtime.dirty = true;
  // Phase 7: schedule a debounced autosave here.
  if (!opts.silent) render();
}

/* --- lookups -------------------------------------------------------------- */

function getItem(id) {
  return state.items[id] || null;
}

function getTier(id) {
  return state.tiers.find(t => t.id === id) || null;
}

/** Every item id on the board, tiers first then the pool, in visual order. */
function allItemIds() {
  const ids = [];
  for (const tier of state.tiers) ids.push(...tier.items);
  ids.push(...state.pool);
  return ids;
}

/**
 * Finds the list an item currently sits in.
 * @returns {{ list: string[], index: number, tier: object|null } | null}
 */
function locateItem(id) {
  for (const tier of state.tiers) {
    const index = tier.items.indexOf(id);
    if (index !== -1) return { list: tier.items, index, tier };
  }
  const index = state.pool.indexOf(id);
  if (index !== -1) return { list: state.pool, index, tier: null };
  return null;
}

/* ==========================================================================
   3. DOM HELPERS
   ==========================================================================

   Elements are built rather than assembled from HTML strings, so user text
   can never be interpreted as markup. */

const $ = sel => document.querySelector(sel);

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key === "style") applyStyle(node, value);
    else if (key === "dataset") Object.assign(node.dataset, value);
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of [].concat(children)) {
    if (child == null || child === false) continue;
    node.append(child);
  }
  return node;
}

/** Custom properties need setProperty — assigning to style[key] drops them. */
function applyStyle(node, styles) {
  for (const [key, value] of Object.entries(styles)) {
    if (key.startsWith("--")) node.style.setProperty(key, value);
    else node.style[key] = value;
  }
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

/**
 * Swaps a text element's contents for an input. Enter or blur commits, Escape
 * reverts. Shared by the list title, tier names and item names.
 */
function startRename(target, current, onCommit) {
  if (target.dataset.editing) return;
  target.dataset.editing = "1";

  const input = el("input", {
    class: "inline-input",
    type: "text",
    value: current,
    "aria-label": "Name",
  });
  target.replaceChildren(input);
  input.focus();
  input.select();

  let settled = false;
  const finish = save => {
    if (settled) return;
    settled = true;
    delete target.dataset.editing;
    const next = input.value.trim();
    if (save && next && next !== current) onCommit(next);
    else render();
  };

  input.addEventListener("keydown", event => {
    // Escape must not reach the document handler and close the panel too.
    event.stopPropagation();
    if (event.key === "Enter") { event.preventDefault(); finish(true); }
    else if (event.key === "Escape") { event.preventDefault(); finish(false); }
  });
  input.addEventListener("blur", () => finish(true));
}

/* ==========================================================================
   4. ACTIONS

   Every document mutation lives here and routes through commit().
   ========================================================================== */

function setTitle(title) {
  commit(() => { state.title = title; });
}

/* --- tiers ---------------------------------------------------------------- */

function addTier() {
  commit(() => {
    state.tiers.push({
      id: newId("tier"),
      name: DEFAULT_TIER_NAME,
      color: TIER_PALETTE[state.tiers.length % TIER_PALETTE.length],
      items: [],
    });
  });
}

function renameTier(id, name) {
  commit(() => { const tier = getTier(id); if (tier) tier.name = name; });
}

function recolorTier(id, color) {
  commit(() => { const tier = getTier(id); if (tier) tier.color = color; });
}

/** Items outlive their tier — deleting a row returns its contents to the pool. */
function deleteTier(id) {
  commit(() => {
    const index = state.tiers.findIndex(tier => tier.id === id);
    if (index === -1) return;
    state.pool.push(...state.tiers[index].items);
    state.tiers.splice(index, 1);
  });
}

/* --- items ---------------------------------------------------------------- */

function addItem() {
  const id = newId("item");
  commit(() => {
    state.items[id] = {
      id,
      name: DEFAULT_ITEM_NAME + " " + (Object.keys(state.items).length + 1),
      shortType: "text",
      shortText: "",
      image: null,
      description: "",
      accent: null,
    };
    state.pool.push(id);
  });
  return id;
}

function renameItem(id, name) {
  commit(() => { const item = getItem(id); if (item) item.name = name; });
}

function deleteItem(id) {
  commit(() => {
    const loc = locateItem(id);
    if (loc) loc.list.splice(loc.index, 1);
    delete state.items[id];
    // Phase 5: release the item's image if no other item references it.
  });
  if (runtime.selectedItemId === id) closePanel();
}

/* --- two-step delete ------------------------------------------------------ */

function armDelete(key) {
  runtime.pendingDelete = key;
  render();
}

/** @returns {boolean} whether anything was armed */
function clearPendingDelete() {
  if (!runtime.pendingDelete) return false;
  runtime.pendingDelete = null;
  render();
  return true;
}

/* ==========================================================================
   5. RENDER

   The whole board is rebuilt on every commit. That is fine at this size;
   Phase 4 introduces targeted card updates once typing in the detail panel
   makes full re-renders wasteful.
   ========================================================================== */

const dom = {};

function cacheDom() {
  dom.main       = $("#main");
  dom.boardScroll = $("#board-scroll");
  dom.dragLayer  = $("#drag-layer");
  dom.title      = $("#list-title");
  dom.toolbar    = $("#toolbar");
  dom.tiers      = $("#tiers");
  dom.poolDrop   = $("#pool-drop");
  dom.panel      = $("#panel");
  dom.panelBody  = $("#panel-body");
  dom.panelClose = $("#panel-close");
}

function render() {
  renderHeader();
  renderTiers();
  renderPool();
  renderPanel();
}

/* --- header --------------------------------------------------------------- */

function renderHeader() {
  if (!dom.title.dataset.editing) dom.title.textContent = state.title;

  clear(dom.toolbar);
  // Phase 6 adds import/export here.
  dom.toolbar.append(
    el("button", { class: "tool-btn", type: "button", text: "Add item", onclick: () => addItem() }),
    el("button", { class: "tool-btn", type: "button", text: "Add tier", onclick: addTier }),
  );
}

/* --- tiers ---------------------------------------------------------------- */

function renderTiers() {
  clear(dom.tiers);
  for (const tier of state.tiers) {
    dom.tiers.append(renderTier(tier));
  }
}

function renderTier(tier) {
  const confirming = runtime.pendingDelete === "tier:" + tier.id;

  const label = el("div", {
    class: "tier-label",
    style: { "--tier-color": tier.color },
  }, confirming ? renderTierConfirm(tier) : [
    // Not reachable by keyboard yet — Phase 8 adds the keyboard route for
    // both reordering and placement.
    el("div", {
      class: "tier-grip",
      title: "Drag to reorder",
      "aria-hidden": "true",
      text: "⠿",
    }),
    el("div", {
      class: "tier-name editable",
      text: tier.name,
      title: "Click to rename",
      onclick: event => startRename(
        event.currentTarget, tier.name, name => renameTier(tier.id, name)),
    }),
  ]);

  const drop = el("div", {
    class: "tier-drop",
    dataset: { dropZone: "tier", tierId: tier.id },
  });

  if (tier.items.length === 0) {
    drop.append(el("div", { class: "empty-hint", text: "Empty" }));
  } else {
    for (const id of tier.items) {
      const item = getItem(id);
      if (item) drop.append(renderItem(item));
    }
  }

  const tools = el("div", { class: "tier-tools" }, [
    el("input", {
      class: "tier-color",
      type: "color",
      value: tier.color,
      title: "Tier colour",
      onchange: event => recolorTier(tier.id, event.target.value),
    }),
    el("button", {
      class: "icon-btn danger",
      type: "button",
      text: "✕",
      title: "Delete tier",
      onclick: () => armDelete("tier:" + tier.id),
    }),
  ]);

  return el("div", {
    class: "tier",
    dataset: { tierId: tier.id },
  }, [label, drop, tools]);
}

/** Confirmation drawn into the tier's label cell, which has room for words. */
function renderTierConfirm(tier) {
  const count = tier.items.length;
  return [
    el("div", { class: "confirm-msg", text: "Delete tier?" }),
    count > 0 && el("div", {
      class: "confirm-sub",
      text: count + (count === 1 ? " item" : " items") + " → Unassigned",
    }),
    el("div", { class: "confirm-row" }, [
      el("button", {
        class: "confirm-btn", type: "button", text: "Delete",
        onclick: () => { runtime.pendingDelete = null; deleteTier(tier.id); },
      }),
      el("button", {
        class: "confirm-btn", type: "button", text: "Cancel",
        onclick: clearPendingDelete,
      }),
    ]),
  ];
}

/* --- pool ----------------------------------------------------------------- */

function renderPool() {
  clear(dom.poolDrop);
  dom.poolDrop.dataset.dropZone = "pool";

  if (state.pool.length === 0) {
    dom.poolDrop.append(el("div", {
      class: "empty-hint",
      text: "Unranked items collect here.",
    }));
    return;
  }

  for (const id of state.pool) {
    const item = getItem(id);
    if (item) dom.poolDrop.append(renderItem(item));
  }
}

/* --- item cards ----------------------------------------------------------- */

function renderItem(item) {
  const confirming = runtime.pendingDelete === "item:" + item.id;
  const short = (item.shortText || "").trim();
  const hasShort = item.shortType === "text" && short !== "";

  // Phase 5 branches here on item.shortType === "image".
  const body = el("div", {
    class: "item-body" + (hasShort ? "" : " is-empty"),
  }, [
    el("span", { text: hasShort ? short : "—" }),
  ]);

  const name = el("div", {
    class: "item-name editable",
    text: item.name,
    title: item.name + " — click to rename",
    onclick: event => startRename(
      event.currentTarget, item.name, next => renameItem(item.id, next)),
  });

  const tools = el("div", { class: "item-tools" }, [
    el("button", {
      class: "icon-btn danger item-del" + (confirming ? " confirming" : ""),
      type: "button",
      text: confirming ? "Delete?" : "✕",
      title: confirming ? "Click again to delete" : "Delete item",
      onclick: () => {
        if (!confirming) return armDelete("item:" + item.id);
        runtime.pendingDelete = null;
        deleteItem(item.id);
      },
    }),
  ]);

  return el("div", {
    class: "item",
    dataset: { itemId: item.id },
  }, [tools, body, name]);
}

/* --- detail panel --------------------------------------------------------- */

function renderPanel() {
  const open = runtime.panelOpen && runtime.selectedItemId != null;
  dom.main.classList.toggle("panel-open", open);
  dom.panel.setAttribute("aria-hidden", open ? "false" : "true");

  clear(dom.panelBody);
  if (!open) return;

  // Phase 4 builds the real editing surface here.
  const item = getItem(runtime.selectedItemId);
  if (item) dom.panelBody.append(el("div", { text: item.name }));
}

function openPanel(itemId) {
  runtime.selectedItemId = itemId;
  runtime.panelOpen = true;
  renderPanel();
}

function closePanel() {
  runtime.panelOpen = false;
  renderPanel();
}

/* ==========================================================================
   6. DRAGGING

   Pointer Events rather than the HTML5 drag-and-drop API: consistent on
   touch, and the drag image is a real element we can style.

   The dragged element doubles as the placeholder — it is moved around the DOM
   during the drag to preview the drop, while a clone follows the pointer. On
   release the affected lists are read back out of the DOM, so what was
   previewed is exactly what is committed. Nothing touches `state` until the
   drop, which makes cancelling a matter of re-rendering.

   One engine, two kinds:
     "item"  cards, moving between tier drop zones and the pool, laid out in
             wrapping rows so the insertion scan is two-dimensional
     "tier"  whole rows, reordering within #tiers, vertical only

   Starting a drag differs by input: a mouse needs a few pixels of travel, a
   touch needs a long press, so that a finger on a card still scrolls the page.
   ========================================================================== */

const DRAG_THRESHOLD = 5;        // px of travel before a press becomes a drag
const LONG_PRESS_MS = 400;       // touch hold before a press becomes a drag
const TOUCH_SLOP = 10;           // px of travel that abandons the long press
const AUTOSCROLL_EDGE = 64;      // px band at the board's edges
const AUTOSCROLL_MAX = 22;       // px per frame at the very edge

function onBoardPointerDown(event) {
  if (runtime.drag || runtime.pendingDrag) return;
  if (event.pointerType === "mouse" && event.button !== 0) return;

  const grip = event.target.closest(".tier-grip");
  const node = grip ? event.target.closest(".tier") : event.target.closest(".item");
  if (!node) return;
  // Controls and an in-progress rename own their own gestures.
  if (!grip && event.target.closest(".item-tools, .inline-input")) return;

  const pending = {
    kind: grip ? "tier" : "item",
    node,
    pointerId: event.pointerId,
    pointerType: event.pointerType,
    startX: event.clientX,
    startY: event.clientY,
    timer: 0,
  };
  runtime.pendingDrag = pending;

  window.addEventListener("pointermove", onDragPointerMove);
  window.addEventListener("pointerup", onDragPointerUp);
  window.addEventListener("pointercancel", onDragPointerCancel);
  // Non-passive: once a touch drag is live, the page must stop scrolling
  // underneath it.
  window.addEventListener("touchmove", onDragTouchMove, { passive: false });

  if (event.pointerType !== "mouse") {
    pending.timer = setTimeout(() => {
      if (runtime.pendingDrag !== pending) return;
      beginDrag(pending, { clientX: pending.startX, clientY: pending.startY });
      if (navigator.vibrate) navigator.vibrate(12);
    }, LONG_PRESS_MS);
  }
}

function onDragPointerMove(event) {
  const pending = runtime.pendingDrag;

  if (pending && !runtime.drag) {
    if (event.pointerId !== pending.pointerId) return;
    const travelled = Math.hypot(event.clientX - pending.startX,
                                 event.clientY - pending.startY);

    if (pending.pointerType === "mouse") {
      if (travelled < DRAG_THRESHOLD) return;
      beginDrag(pending, event);
    } else {
      // Moving before the hold completes means this was a scroll, not a drag.
      if (travelled > TOUCH_SLOP) releaseDragListeners();
      return;
    }
  }

  const drag = runtime.drag;
  if (!drag || event.pointerId !== drag.pointerId) return;
  drag.pointerX = event.clientX;
  drag.pointerY = event.clientY;
  event.preventDefault();
}

function onDragTouchMove(event) {
  if (runtime.drag) event.preventDefault();
}

function onDragPointerUp(event) {
  if (runtime.pendingDrag && event.pointerId !== runtime.pendingDrag.pointerId) return;
  const wasDragging = runtime.drag != null;
  releaseDragListeners();
  if (wasDragging) {
    endDrag(true);
    swallowNextClick();   // a drag must not also fire the card's click handlers
  }
}

function onDragPointerCancel() {
  releaseDragListeners();
  if (runtime.drag) endDrag(false);
}

function releaseDragListeners() {
  if (runtime.pendingDrag && runtime.pendingDrag.timer) {
    clearTimeout(runtime.pendingDrag.timer);
  }
  runtime.pendingDrag = null;
  window.removeEventListener("pointermove", onDragPointerMove);
  window.removeEventListener("pointerup", onDragPointerUp);
  window.removeEventListener("pointercancel", onDragPointerCancel);
  window.removeEventListener("touchmove", onDragTouchMove);
}

function beginDrag(pending, event) {
  if (pending.timer) clearTimeout(pending.timer);

  const node = pending.node;
  const isTier = pending.kind === "tier";
  const rect = node.getBoundingClientRect();

  const ghost = node.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.classList.remove("is-placeholder");
  Object.assign(ghost.style, {
    left: rect.left + "px",
    top: rect.top + "px",
    width: rect.width + "px",
    height: rect.height + "px",
  });
  dom.dragLayer.append(ghost);

  node.classList.add("is-placeholder");
  document.body.classList.add("is-dragging");

  const zone = isTier ? dom.tiers : node.parentNode;
  if (!isTier) {
    // "Empty" hints would otherwise take up room in the zones being dropped
    // into. The next render puts them back.
    for (const hint of dom.boardScroll.querySelectorAll(".empty-hint")) hint.remove();
    zone.classList.add("is-drop-target");
  }

  runtime.drag = {
    kind: pending.kind,
    node,
    ghost,
    zone,
    originZone: zone,
    // A full-width row tilted a few degrees looks broken; a card does not.
    ghostTransform: isTier ? " scale(1.01)" : " rotate(2.5deg) scale(1.04)",
    pointerId: pending.pointerId,
    startX: pending.startX,
    startY: pending.startY,
    pointerX: event.clientX,
    pointerY: event.clientY,
    zones: isTier ? [] : [...dom.boardScroll.querySelectorAll("[data-drop-zone]")],
    frame: 0,
  };
  runtime.drag.frame = requestAnimationFrame(dragFrame);
}

/**
 * One loop for the whole drag rather than work on each pointermove: it keeps
 * the ghost in sync at the display's rate, and it means auto-scroll keeps
 * running while the pointer is held still at the edge.
 */
function dragFrame() {
  const drag = runtime.drag;
  if (!drag) return;

  drag.ghost.style.transform =
    "translate(" + (drag.pointerX - drag.startX) + "px," +
                   (drag.pointerY - drag.startY) + "px)" + drag.ghostTransform;

  autoScroll(drag);
  if (drag.kind === "tier") updateTierPlaceholder(drag);
  else updateItemPlaceholder(drag);

  drag.frame = requestAnimationFrame(dragFrame);
}

function autoScroll(drag) {
  const rect = dom.boardScroll.getBoundingClientRect();
  let dy = 0;

  if (drag.pointerY < rect.top + AUTOSCROLL_EDGE) {
    const depth = (rect.top + AUTOSCROLL_EDGE - drag.pointerY) / AUTOSCROLL_EDGE;
    dy = -AUTOSCROLL_MAX * Math.min(1, depth);
  } else if (drag.pointerY > rect.bottom - AUTOSCROLL_EDGE) {
    const depth = (drag.pointerY - (rect.bottom - AUTOSCROLL_EDGE)) / AUTOSCROLL_EDGE;
    dy = AUTOSCROLL_MAX * Math.min(1, depth);
  }

  if (dy) dom.boardScroll.scrollTop += dy;
}

/** Rects are read fresh each frame: moving the placeholder reflows the board. */
function zoneAt(drag, x, y) {
  for (const zone of drag.zones) {
    const rect = zone.getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      return zone;
    }
  }
  return null;
}

/**
 * The card the placeholder should sit before, or null to append.
 *
 * Cards wrap onto multiple rows, so the scan is row-major: skip rows entirely
 * above the pointer, then within the pointer's row take the first card whose
 * horizontal midpoint the pointer has not yet passed. Running off the end of a
 * row falls through to the next row's first card, whose top is below the
 * pointer — which is the correct answer for "past the end of this row".
 */
function insertionRef(zone, placeholder, x, y) {
  for (const card of zone.children) {
    if (card === placeholder || !card.classList.contains("item")) continue;
    const rect = card.getBoundingClientRect();
    if (y > rect.bottom) continue;
    if (y < rect.top) return card;
    if (x < rect.left + rect.width / 2) return card;
  }
  return null;
}

function updateItemPlaceholder(drag) {
  const zone = zoneAt(drag, drag.pointerX, drag.pointerY);

  if (zone !== drag.zone) {
    if (drag.zone) drag.zone.classList.remove("is-drop-target");
    if (zone) zone.classList.add("is-drop-target");
    drag.zone = zone;
  }

  // Outside every zone: leave the preview where it was, so releasing there
  // drops the item back at its last valid position rather than nowhere.
  if (!zone) return;

  const before = insertionRef(zone, drag.node, drag.pointerX, drag.pointerY);
  if (before === drag.node) return;
  if (drag.node.parentNode === zone && drag.node.nextSibling === before) return;
  zone.insertBefore(drag.node, before);
}

/* --- tier rows ------------------------------------------------------------ */

/**
 * The row the placeholder should sit before, or null to append.
 *
 * Deliberately measured with offsetTop rather than getBoundingClientRect:
 * rows carry FLIP transforms mid-animation, and hit-testing against animated
 * positions makes the decision feed back into itself and flicker. Layout
 * position is the stable truth.
 */
function tierInsertionRef(container, placeholder, pointerY) {
  const y = pointerY - container.getBoundingClientRect().top;

  for (const row of container.children) {
    if (row === placeholder) continue;
    const top = row.offsetTop - container.offsetTop;
    if (y < top + row.offsetHeight / 2) return row;
  }
  return null;
}

function updateTierPlaceholder(drag) {
  const before = tierInsertionRef(dom.tiers, drag.node, drag.pointerY);
  if (before === drag.node) return;
  if (drag.node.nextSibling === before) return;

  flipRows(dom.tiers, drag.node, () => dom.tiers.insertBefore(drag.node, before));
}

/**
 * Moves rows via `mutate`, then animates them from where they were to where
 * they now are. Reading the "before" rects after any in-flight transform means
 * a gap that moves twice in quick succession animates from its visual position
 * rather than snapping.
 */
function flipRows(container, exclude, mutate) {
  const rows = [...container.children].filter(row => row !== exclude);
  const before = rows.map(row => row.getBoundingClientRect().top);

  mutate();

  const after = rows.map(row => row.getBoundingClientRect().top);
  rows.forEach((row, i) => {
    const delta = before[i] - after[i];
    if (!delta) return;
    row.style.transition = "none";
    row.style.transform = "translateY(" + delta + "px)";
    requestAnimationFrame(() => {
      row.style.transition = "transform var(--dur) var(--ease)";
      row.style.transform = "";
    });
  });
}

/** @param {boolean} keep  commit the previewed position, or discard it */
function endDrag(keep) {
  const drag = runtime.drag;
  if (!drag) return;
  runtime.drag = null;

  cancelAnimationFrame(drag.frame);
  drag.ghost.remove();
  document.body.classList.remove("is-dragging");
  if (drag.kind === "item" && drag.zone) drag.zone.classList.remove("is-drop-target");
  drag.node.classList.remove("is-placeholder");

  if (!keep) {
    // `state` was never touched, so a re-render is the whole undo — it also
    // clears any FLIP transforms still sitting on the rows.
    render();
    return;
  }

  if (drag.kind === "tier") {
    commit(syncTiersFromDom);
    return;
  }

  const touched = new Set([drag.originZone, drag.node.parentNode]);
  commit(() => {
    for (const zone of touched) syncListFromDom(zone);
  });
}

/** Adopts the DOM's row order as the truth for state.tiers. */
function syncTiersFromDom() {
  const byId = new Map(state.tiers.map(tier => [tier.id, tier]));
  const ordered = [];
  for (const row of dom.tiers.children) {
    const tier = byId.get(row.dataset.tierId);
    if (tier) ordered.push(tier);
  }
  if (ordered.length !== state.tiers.length) return;   // never lose a row
  state.tiers = ordered;
}

function listForZone(zone) {
  if (!zone || !zone.dataset) return null;
  if (zone.dataset.dropZone === "pool") return state.pool;
  const tier = getTier(zone.dataset.tierId);
  return tier ? tier.items : null;
}

/** Adopts the DOM's card order as the truth for that zone's list. */
function syncListFromDom(zone) {
  const list = listForZone(zone);
  if (!list) return;
  const ids = [];
  for (const node of zone.children) {
    if (node.classList.contains("item")) ids.push(node.dataset.itemId);
  }
  list.length = 0;
  list.push(...ids);
}

function swallowNextClick() {
  const swallow = event => {
    event.stopPropagation();
    event.preventDefault();
  };
  window.addEventListener("click", swallow, { capture: true, once: true });
  // Touch may never produce the click; don't leave the trap armed for the
  // user's next real one.
  setTimeout(() => window.removeEventListener("click", swallow, { capture: true }), 350);
}

/* ==========================================================================
   7. EVENTS
   ========================================================================== */

function bindEvents() {
  dom.panelClose.addEventListener("click", closePanel);

  dom.boardScroll.addEventListener("pointerdown", onBoardPointerDown);

  dom.title.classList.add("editable");
  dom.title.title = "Click to rename";
  dom.title.addEventListener("click", () => {
    startRename(dom.title, state.title, setTitle);
  });

  // Disarm a pending delete when attention moves elsewhere. This listens for
  // click rather than pointerdown so the clicked control's own handler runs
  // first — re-rendering on pointerdown would detach it mid-gesture.
  document.addEventListener("click", event => {
    if (!runtime.pendingDelete) return;
    if (event.target.closest(".confirming, .confirm-row, .icon-btn.danger")) return;
    clearPendingDelete();
  });

  document.addEventListener("keydown", event => {
    if (event.key !== "Escape") return;
    if (runtime.drag) {
      releaseDragListeners();
      endDrag(false);
      return;
    }
    if (clearPendingDelete()) return;
    if (runtime.panelOpen) closePanel();
  });
}

/* ==========================================================================
   8. BOOT
   ========================================================================== */

function boot() {
  cacheDom();
  bindEvents();
  // Phase 7 restores a persisted session here before the first render.
  render();
}

boot();
</script>
</body>
</html>
